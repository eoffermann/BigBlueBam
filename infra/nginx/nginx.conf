        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Beacon Frontend SPA ──────────────────────────────────────────
    location /beacon/ {
        alias /usr/share/nginx/html/beacon/;
        try_files $uri $uri/ /beacon/index.html;
