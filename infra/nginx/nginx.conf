        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Brief WebSocket (Yjs collaboration) ──────────────────────────
    location /brief/ws {
        proxy_pass http://brief-api:4005/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Bolt Frontend SPA ───────────────────────────────────────────
    location /bolt/ {
        alias /usr/share/nginx/html/bolt/;
        try_files $uri $uri/ /bolt/index.html;
    }

    # ── Bolt API proxy ──────────────────────────────────────────────
    location /bolt/api/ {
        proxy_pass http://bolt-api:4006/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Bearing Goals & OKRs SPA ─────────────────────────────────────────
    location /bearing/ {
        alias /usr/share/nginx/html/bearing/;
        try_files $uri $uri/ /bearing/index.html;
    }

    # ── Bearing API proxy ────────────────────────────────────────────
    location /bearing/api/ {
        proxy_pass http://bearing-api:4007/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Board SPA ────────────────────────────────────────────────────
    location /board/ {
        alias /usr/share/nginx/html/board/;
        try_files $uri $uri/ /board/index.html;
    }

    # ── Board API proxy ──────────────────────────────────────────────
    location /board/api/ {
        proxy_pass http://board-api:4008/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Board WebSocket (tldraw collaboration + chat) ────────────────
    location /board/ws {
        proxy_pass http://board-api:4008/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Blast Frontend SPA ────────────────────────────────────────
    location /blast/ {
        alias /usr/share/nginx/html/blast/;
        try_files $uri $uri/ /blast/index.html;
    }

    # ── Blast API proxy ─────────────────────────────────────────────
    location /blast/api/ {
        proxy_pass http://blast-api:4010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Blast tracking endpoints (short paths for email links) ─────
    location /t/ {
        proxy_pass http://blast-api:4010/t/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /unsub/ {
        proxy_pass http://blast-api:4010/unsub/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Bench Frontend SPA ────────────────────────────────────────
    location /bench/ {
        alias /usr/share/nginx/html/bench/;
        try_files $uri $uri/ /bench/index.html;
    }

    # ── Bench API proxy ─────────────────────────────────────────────
    location /bench/api/ {
        proxy_pass http://bench-api:4011/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Blank Frontend SPA ─────────────────────────────────────────
    location /blank/ {
        alias /usr/share/nginx/html/blank/;
        try_files $uri $uri/ /blank/index.html;
    }

    # ── Blank API proxy ──────────────────────────────────────────────
    location /blank/api/ {
        proxy_pass http://blank-api:4013/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Public form endpoints (no auth) ──────────────────────────────
    location /forms/ {
        proxy_pass http://blank-api:4013/forms/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Blueprint API proxy ─────────────────────────────────────────
    # blueprint-api registers all routes with prefix '/v1', mirroring the
    # bench-api / bond-api / bolt-api pattern. nginx strips the
    # `/blueprint/api/` prefix and the SPA hits paths like
    # `/blueprint/api/v1/diagrams`, which become `/v1/diagrams` upstream.
    location /blueprint/api/ {
        proxy_pass http://blueprint-api:4015/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Blueprint WebSocket (Hocuspocus live-multiplayer follow-up) ─
    location /blueprint/ws {
        proxy_pass http://blueprint-api:4015/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Blueprint Frontend SPA ─────────────────────────────────────
    location /blueprint/ {
        alias /usr/share/nginx/html/blueprint/;
        try_files $uri $uri/ /blueprint/index.html;
    }

    # ── Bureau API proxy ───────────────────────────────────────────
    # bureau-api owns floors, rooms, presence, knocks, summons (teleport),
    # bookings, settings, and LiveKit token minting. Same port as blueprint-
    # api inside the container — fine because each runs in its own network
    # namespace and nginx routes by upstream hostname.
    location /bureau/api/ {
        proxy_pass http://bureau-api:4015/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Bureau WebSocket (presence + knock + summons fan-out) ───────
    location /bureau/ws {
        proxy_pass http://bureau-api:4015/bureau/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Bureau Frontend SPA ────────────────────────────────────────
    location /bureau/ {
        alias /usr/share/nginx/html/bureau/;
        try_files $uri $uri/ /bureau/index.html;
    }

    # ── LiveKit signal WebSocket (browser-facing) ───────────────────
    # The call widget connects here when LIVEKIT_WS_URL is the relative
    # path /livekit-ws: nginx terminates TLS so https pages get a same-
    # origin wss URL instead of a mixed-content-blocked ws://host:7880.
    # The SDK appends /rtc, /rtc/validate, etc. under this prefix.
    location /livekit-ws/ {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Book Frontend SPA ──────────────────────────────────────────
    location /book/ {
        alias /usr/share/nginx/html/book/;
        try_files $uri $uri/ /book/index.html;
    }

    # ── Book API proxy ───────────────────────────────────────────
    location /book/api/ {
        proxy_pass http://book-api:4012/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Book public booking pages ────────────────────────────────
    location /meet/ {
        proxy_pass http://book-api:4012/meet/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Bond Frontend SPA ─────────────────────────────────────────
    location /bond/ {
        alias /usr/share/nginx/html/bond/;
        try_files $uri $uri/ /bond/index.html;
    }

    # ── Bond realtime WebSocket (T1 live pipeline updates) ──────────
    location /bond/ws {
        proxy_pass http://bond-api:4009/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Bond API proxy ──────────────────────────────────────────────
    location /bond/api/ {
        proxy_pass http://bond-api:4009/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Bill Frontend SPA ───────────────────────────────────────────
    location /bill/ {
        alias /usr/share/nginx/html/bill/;
        try_files $uri $uri/ /bill/index.html;
    }

    # ── Bill API proxy ────────────────────────────────────────────
    location /bill/api/ {
        proxy_pass http://bill-api:4014/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Bill public invoice view (token-based, no auth) ──────────
    location /invoice/ {
        proxy_pass http://bill-api:4014/invoice/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── File serving (shared, proxied through BBB API) ────────────
    location /files/ {
        proxy_pass http://api:4000/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── MCP server ────────────────────────────────────────────────
    # The mcp-server listens on `/mcp` (Streamable HTTP transport) at the
    # upstream. Exact-match locations route `/mcp` and `/mcp/` straight to
    # that upstream path so MCP clients can connect to `https://DOMAIN/mcp/`
    # without suffixing `/mcp`. Subpaths (/mcp/sse, /mcp/messages,
    # /mcp/health, /mcp/tools/call) fall through to the prefix location
    # below, which strips `/mcp/` so the upstream sees `/sse`, `/messages`,
    # `/health`, `/tools/call` — matching apps/mcp-server/src/server.ts.
    location = /mcp {
        proxy_pass http://mcp-server:3001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    location = /mcp/ {
        proxy_pass http://mcp-server:3001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    location /mcp/ {
        proxy_pass http://mcp-server:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # ── BBB helpdesk-api proxy (for BBB frontend's helpdesk panel) ─
    location /helpdesk-api/ {
        proxy_pass http://helpdesk-api:4001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Static asset caching (exclude API/proxy paths) ────────────
    location ~* ^/(b3|helpdesk|banter|beacon|brief|bolt|bearing|board|bond|blast|bill|blank|blueprint|bureau|book|bench)/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
