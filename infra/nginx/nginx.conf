        proxy_send_timeout 86400s;
    }

    # ── Blip public ingest endpoint (no auth) ────────────────────────
    location /blip/ingest/ {
        proxy_pass http://blip-api:4018/ingest/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Blueprint API proxy ─────────────────────────────────────────
    # blueprint-api registers all routes with prefix '/v1', mirroring the
    # bench-api / bond-api / bolt-api pattern. nginx strips the
    # `/blueprint/api/` prefix and the SPA hits paths like
    # `/blueprint/api/v1/diagrams`, which become `/v1/diagrams` upstream.
    location /blueprint/api/ {
        proxy_pass http://blueprint-api:4015/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Blueprint WebSocket (Hocuspocus live-multiplayer follow-up) ─
    location /blueprint/ws {
        proxy_pass http://blueprint-api:4015/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Blueprint Frontend SPA ─────────────────────────────────────
    location /blueprint/ {
        alias /usr/share/nginx/html/blueprint/;
        try_files $uri $uri/ /blueprint/index.html;
    }

    # ── Bureau API proxy ───────────────────────────────────────────
    # bureau-api owns floors, rooms, presence, knocks, summons (teleport),
    # bookings, settings, and LiveKit token minting. Same port as blueprint-
    # api inside the container — fine because each runs in its own network
    # namespace and nginx routes by upstream hostname.
    location /bureau/api/ {
        proxy_pass http://bureau-api:4015/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Bureau WebSocket (presence + knock + summons fan-out) ───────
    location /bureau/ws {
        proxy_pass http://bureau-api:4015/bureau/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Bureau Frontend SPA ────────────────────────────────────────
    location /bureau/ {
        alias /usr/share/nginx/html/bureau/;
        try_files $uri $uri/ /bureau/index.html;
    }

    # ── LiveKit signal WebSocket (browser-facing) ───────────────────
    # The call widget connects here when LIVEKIT_WS_URL is the relative
    # path /livekit-ws: nginx terminates TLS so https pages get a same-
    # origin wss URL instead of a mixed-content-blocked ws://host:7880.
    # The SDK appends /rtc, /rtc/validate, etc. under this prefix.
    location /livekit-ws/ {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Book Frontend SPA ──────────────────────────────────────────
    location /book/ {
        alias /usr/share/nginx/html/book/;
        try_files $uri $uri/ /book/index.html;
    }

    # ── Book API proxy ───────────────────────────────────────────
    location /book/api/ {
        proxy_pass http://book-api:4012/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Book public booking pages ────────────────────────────────
    location /meet/ {
        proxy_pass http://book-api:4012/meet/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Bond Frontend SPA ─────────────────────────────────────────
    location /bond/ {
        alias /usr/share/nginx/html/bond/;
        try_files $uri $uri/ /bond/index.html;
    }

    # ── Bond realtime WebSocket (T1 live pipeline updates) ──────────
    location /bond/ws {
        proxy_pass http://bond-api:4009/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Bond API proxy ──────────────────────────────────────────────
    location /bond/api/ {
        proxy_pass http://bond-api:4009/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Bill Frontend SPA ───────────────────────────────────────────
    location /bill/ {
        alias /usr/share/nginx/html/bill/;
        try_files $uri $uri/ /bill/index.html;
    }

    # ── Bill API proxy ────────────────────────────────────────────
    location /bill/api/ {
        proxy_pass http://bill-api:4014/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Bill public invoice view (token-based, no auth) ──────────
    location /invoice/ {
        proxy_pass http://bill-api:4014/invoice/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── File serving (shared, proxied through BBB API) ────────────
    location /files/ {
        proxy_pass http://api:4000/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Default profile-picture options, reachable from every SPA. No auth: these
    # are bundled, non-sensitive defaults. User-uploaded avatars go via /files/.
    location /avatars/ {
        alias /usr/share/nginx/html/avatars/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Documentation static files (in-app Help viewer) ───────────
    # Serves docs/apps/*/guide.md and related assets. The in-app Help Center
    # component fetches help.md and help-index.json.
    #
    # Help CONTENT (.md/.json) is must-revalidate so a docs edit is visible on
    # the next load instead of being frozen for an hour in the embedded help
    # viewer (which a page hard-reload does NOT refetch). ETag/Last-Modified
    # make revalidation a cheap 304. This regex wins over the /docs/ prefix.
    location ~* ^/docs/.+\.(md|json)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── MCP server ────────────────────────────────────────────────
    # The mcp-server listens on `/mcp` (Streamable HTTP transport) at the
    # upstream. Exact-match locations route `/mcp` and `/mcp/` straight to
    # that upstream path so MCP clients can connect to `https://DOMAIN/mcp/`
    # without suffixing `/mcp`. Subpaths (/mcp/sse, /mcp/messages,
    # /mcp/health, /mcp/tools/call) fall through to the prefix location
    # below, which strips `/mcp/` so the upstream sees `/sse`, `/messages`,
    # `/health`, `/tools/call` — matching apps/mcp-server/src/server.ts.
    location = /mcp {
        proxy_pass http://mcp-server:3001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    location = /mcp/ {
        proxy_pass http://mcp-server:3001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    location /mcp/ {
        proxy_pass http://mcp-server:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # ── BBB helpdesk-api proxy (for BBB frontend's helpdesk panel) ─
    location /helpdesk-api/ {
        proxy_pass http://helpdesk-api:4001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── App shell (index.html): always revalidate, never heuristic-cache ──
    # Same rule as infra/nginx/nginx-with-site.conf (issue #127): without it the
    # browser heuristically caches index.html, keeps referencing hashed bundles that
    # a deploy removed, and shows a blank page or chunk-load error until a hard
    # refresh. `no-cache` still allows a cheap 304. This location declares
    # add_header, so it restates this file's server-level security headers.
    # The SPA list here and in the assets regex below is checked against every
    # `try_files ... /<spa>/index.html` in this file by scripts/check-nginx-spa-lists.mjs.
    location ~* ^/(b3|helpdesk|banter|beacon|brief|bolt|bearing|board|bond|blast|bill|blank|bin|blip|bay|blueprint|bureau|book|bench|basis|braid|bulwark|burn|bursar|bastion)/index\.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # ── Static asset caching (exclude API/proxy paths) ────────────
    location ~* ^/(b3|helpdesk|banter|beacon|brief|bolt|bearing|board|bond|blast|bill|blank|bin|blueprint|bureau|book|bench|basis|braid|bulwark|bay|blip|burn|bursar|bastion)/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
