# Strip the port from $host so a redirect from a remapped HTTP_PORT (e.g.
# the operator picked HTTP_PORT=8080 / HTTPS_PORT=8443 to avoid clashing
# with their NAS admin UI) can re-target the correct external HTTPS port
# without inheriting the wrong port from the original Host header. Used by
# the auxiliary redirect server block when TLS_HTTP_MODE=redirect — see
# infra/nginx/tls-redirect.conf.template and entrypoint.sh.
map $host $host_no_port { ~^([^:]+) $1; default $host; }

server {
    # entrypoint.sh fills these in based on cert presence and TLS_HTTP_MODE:
    #   --HTTP-LISTEN--    -> "listen 80;" or "" (omitted on redirect/https-only).
    #   --TLS-LISTEN-BLOCK-- -> "" or listen 443 ssl + ssl_certificate + HSTS lines.
    # (Single-dash form in comments so the awk substitution in entrypoint.sh
    # does not match these references — only the real placeholders below.)
    __HTTP_LISTEN__
    __TLS_LISTEN_BLOCK__
    server_name _;
    client_max_body_size 25m;

    # ── Relative redirects (Railway / Cloudflare safety) ─────────
    # By default nginx absolutizes every `return 30x /path` into
    # `Location: http://$host:$server_port/path`. On Railway the
    # container listens on PORT=8080, so the absolutized URL becomes
    # `http://bigbluebam.com:8080/path` — Cloudflare can't reach port
    # 8080 on the public hostname and the redirect dies. With
    # `absolute_redirect off`, nginx emits a bare-path Location header
    # that the browser resolves against the original request URL
    # (correct scheme, correct host, no port). This applies to all
    # `return 301`/`return 302` blocks in this file — including the
    # bare-app-prefix helpers below (`location = /b3 { return 301 /b3/; }`)
    # which were the original symptom report. The compose flow stays
    # correct because in that mode the listen port already matches the
    # external port the browser used, so the absolute Location worked
    # by coincidence.
    absolute_redirect off;
    port_in_redirect off;

    # ── Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml font/woff2;

    # ── Security Headers ─────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Permissions-Policy: allow same-origin pages to request camera /
    # microphone / display-capture (screen share) for voice + video calls.
    # Previous value was `camera=(), microphone=()` — empty allowlists
    # which the browser reads as "no origin allowed", silently blocking
    # getUserMedia() even after the user clicks Allow on the OS prompt.
    # `(self)` permits our own origin without leaking the grant to
    # embedded iframes.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

    # ── ACME HTTP-01 challenge (Let's Encrypt) ────────────────────
    # Always present so the same nginx config works for all TLS modes;
    # the path is unused unless the certbot sidecar (compose profile
    # "letsencrypt") is running and writing challenge tokens.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── App-prefix redirect helpers ─────────────────────────────────
    # nginx's prefix matching is strict: `location /b3/` does NOT match
    # `/b3` (no trailing slash). Without these exact-match redirects, a
    # user hitting `http://host/b3` falls through to `location /` which
    # proxies to the marketing site, which then redirects to `/` — the
    # symptom users reported as "going to /b3 from a LAN client always
    # bounces to root." Each `location = /<app>` returns a 301 to the
    # canonical trailing-slash form. `$request_uri` preserves any query
    # string the user landed with.
    location = /b3       { return 301 /b3/; }
    location = /banter   { return 301 /banter/; }
    location = /beacon   { return 301 /beacon/; }
    location = /brief    { return 301 /brief/; }
    location = /bolt     { return 301 /bolt/; }
    location = /bearing  { return 301 /bearing/; }
    location = /board    { return 301 /board/; }
    location = /bond     { return 301 /bond/; }
    location = /blast    { return 301 /blast/; }
    location = /bench    { return 301 /bench/; }
    location = /blank    { return 301 /blank/; }
    location = /bin      { return 301 /bin/; }
    location = /blueprint { return 301 /blueprint/; }
    location = /bureau   { return 301 /bureau/; }
    location = /bill     { return 301 /bill/; }
    location = /book     { return 301 /book/; }
    location = /helpdesk { return 301 /helpdesk/; }

    # ── Authoritative Bam SPA paths under the root ─────────────────
    # The auth/onboarding pages live inside the Bam SPA which is
    # mounted at /b3/. Some emails (older builds, or installs that
    # misconfigured PUBLIC_URL to the site root) ship URLs without
    # the /b3 prefix — e.g. https://example.com/password-reset?token=…
    # Without these rewrites the request lands on the marketing
    # site's catch-all index.html and the user sees the home page
    # instead of the password-reset form. (2026-06-11 invite incident.)
    # Order matters — these run BEFORE the catch-all site fallback.
    rewrite ^/password-reset(/?)$         /b3/password-reset$is_args$args  last;
    rewrite ^/password-change(/?)$        /b3/password-change$is_args$args last;
    rewrite ^/login(/?)$                  /b3/login$is_args$args           last;
    rewrite ^/register(/?)$               /b3/register$is_args$args        last;
    rewrite ^/bootstrap(/?)$              /b3/bootstrap$is_args$args       last;
    rewrite ^/verify-email/(.+)$          /b3/verify-email/$1$is_args$args last;
    rewrite ^/guests/accept/(.+)$         /b3/guests/accept/$1$is_args$args last;

    # ── BBB Frontend SPA ──────────────────────────────────────────
    location /b3/ {
        alias /usr/share/nginx/html/b3/;
        try_files $uri $uri/ /b3/index.html;
    }

    # ── BBB API proxy ─────────────────────────────────────────────
    location /b3/api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── BBB WebSocket ─────────────────────────────────────────────
    location /b3/ws {
        proxy_pass http://api:4000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── Helpdesk Frontend SPA ─────────────────────────────────────
    # D-010: path-based multi-tenant routing ("/helpdesk/<org>/<project>/...")
    # is handled entirely by the SPA router. Deep links like
    # /helpdesk/mage-inc/tickets/42 do not exist as real files, so the
    # try_files fallback must resolve to /helpdesk/index.html which boots
    # the SPA and its parseTenantFromPath() takes over. The /helpdesk/api/
    # and /helpdesk/ws locations below take longest-prefix precedence and
    # are unaffected by this fallback.
    location /helpdesk/ {
        alias /usr/share/nginx/html/helpdesk/;
        try_files $uri $uri/ /helpdesk/index.html;
    }

    # ── Helpdesk API proxy ────────────────────────────────────────
