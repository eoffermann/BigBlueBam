    # ── Bay SPA ──────────────────────────────────────────────────────
    location /bay/ {
        alias /usr/share/nginx/html/bay/;
        try_files $uri $uri/ /bay/index.html;
    }

    # ── Bay realtime WebSocket (live annotations/decisions) ──────────
    location /bay/ws {
        proxy_pass http://bay-api:4017/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Bay API proxy (media review) ─────────────────────────────────
    location /bay/api/ {
        proxy_pass http://bay-api:4017/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Blip SPA ─────────────────────────────────────────────────────
    location /blip/ {
        alias /usr/share/nginx/html/blip/;
        try_files $uri $uri/ /blip/index.html;
    }

    # ── Blip realtime WebSocket ──────────────────────────────────────
    location /blip/ws {
        proxy_pass http://blip-api:4018/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Blip API proxy ───────────────────────────────────────────────
    location /blip/api/ {
        proxy_pass http://blip-api:4018/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Blip public ingest endpoint (no auth) ────────────────────────
    location /blip/ingest/ {
        proxy_pass http://blip-api:4018/ingest/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Blueprint API proxy ─────────────────────────────────────────
    # blueprint-api registers all routes with prefix '/v1', mirroring the
    # bench-api / bond-api / bolt-api pattern. nginx strips the
    # `/blueprint/api/` prefix and the SPA hits paths like
    # `/blueprint/api/v1/diagrams`, which become `/v1/diagrams` upstream.
    location /blueprint/api/ {
        proxy_pass http://blueprint-api:4015/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Blueprint WebSocket (Hocuspocus live-multiplayer follow-up) ─
    location /blueprint/ws {
        proxy_pass http://blueprint-api:4015/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Blueprint Frontend SPA ─────────────────────────────────────
    location /blueprint/ {
        alias /usr/share/nginx/html/blueprint/;
        try_files $uri $uri/ /blueprint/index.html;
    }

    # ── Bureau API proxy ────────────────────────────────────────────
    # bureau-api owns floors, rooms, presence, knocks, summons (teleport),
    # and the WS hub. Container-internal port 4015 is shared with
    # blueprint-api — this is fine, each container has its own network
    # namespace and nginx routes by upstream hostname, not port.
    location /bureau/api/ {
        proxy_pass http://bureau-api:4015/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Bureau WebSocket (presence + location_update + summon + knock) ──
    location /bureau/ws {
        proxy_pass http://bureau-api:4015/bureau/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Bureau Frontend SPA ─────────────────────────────────────────
    location /bureau/ {
        alias /usr/share/nginx/html/bureau/;
        try_files $uri $uri/ /bureau/index.html;
    }

    # ── LiveKit signal WebSocket (browser-facing) ────────────────────
    # The call widget connects here when LIVEKIT_WS_URL is the relative
    # path /livekit-ws: nginx terminates TLS so https pages get a same-
    # origin wss URL instead of a mixed-content-blocked ws://host:7880.
    # The SDK appends /rtc, /rtc/validate, etc. under this prefix.
    location /livekit-ws/ {
        proxy_pass http://livekit:7880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Bill Frontend SPA ───────────────────────────────────────────
    location /bill/ {
        alias /usr/share/nginx/html/bill/;
        try_files $uri $uri/ /bill/index.html;
    }

    # ── Bill API proxy ───────────────────────────────────────────
    location /bill/api/ {
        proxy_pass http://bill-api:4014/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Bill public invoice pages ────────────────────────────────
    location /invoice/ {
        proxy_pass http://bill-api:4014/invoice/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Book Frontend SPA ──────────────────────────────────────────
    location /book/ {
        alias /usr/share/nginx/html/book/;
        try_files $uri $uri/ /book/index.html;
    }

    # ── Book API proxy ───────────────────────────────────────────
    location /book/api/ {
        proxy_pass http://book-api:4012/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Book public booking pages ────────────────────────────────
    location /meet/ {
        proxy_pass http://book-api:4012/meet/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── File serving (shared, proxied through BBB API) ────────────
    location /files/ {
        proxy_pass http://api:4000/files/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── MCP server ────────────────────────────────────────────────
    # The mcp-server listens on `/mcp` (Streamable HTTP transport) at the
    # upstream. Exact-match locations route `/mcp` and `/mcp/` straight to
    # that upstream path so MCP clients can connect to `https://DOMAIN/mcp/`
    # without suffixing `/mcp`. Subpaths (/mcp/sse, /mcp/messages,
    # /mcp/health, /mcp/tools/call) fall through to the prefix location
    # below, which strips `/mcp/` so the upstream sees `/sse`, `/messages`,
    # `/health`, `/tools/call` — matching apps/mcp-server/src/server.ts.
    location = /mcp {
        proxy_pass http://mcp-server:3001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    location = /mcp/ {
        proxy_pass http://mcp-server:3001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    location /mcp/ {
        proxy_pass http://mcp-server:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # ── BBB helpdesk-api proxy (for BBB frontend's helpdesk panel) ─
    location /helpdesk-api/ {
        proxy_pass http://helpdesk-api:4001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Documentation static files (in-app Help viewer) ───────────
    # Serves docs/apps/*/guide.md and related assets. The in-app Help Center
    # component in each frontend app fetches /docs/apps/{slug}/
    # help.md and help-index.json.
    #
    # Help CONTENT (.md/.json) is served must-revalidate so a docs edit is
    # visible on the next load instead of being frozen for an hour in the
    # embedded help viewer (which a page hard-reload does NOT refetch). The
    # files carry ETag + Last-Modified, so revalidation is a cheap 304 when
    # nothing changed. This regex location wins over the /docs/ prefix below.
    location ~* ^/docs/.+\.(md|json)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Default profile-picture options, reachable from every SPA. No auth: these
    # are bundled, non-sensitive defaults. User-uploaded avatars go via /files/.
    location /avatars/ {
        alias /usr/share/nginx/html/avatars/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Static asset caching (exclude API/proxy paths) ────────────
    location ~* ^/(b3|helpdesk|banter|beacon|brief|bolt|bearing|board|bond|blast|bill|blank|bin|blueprint|bureau|book|bench|basis|braid|bulwark|bay|blip|burn|bursar)/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Marketing site (root domain) ──────────────────────────────
    # Everything not claimed by one of the prefix locations above falls
    # through to the site service. Prefix matches (/b3/, /helpdesk/,
    # /banter/, /files/, /mcp/, /helpdesk-api/) take precedence over
    # this plain `/` prefix per nginx's longest-prefix-wins rule.
    #
    # The marketing site is intentionally embeddable in iframes from any
    # origin so press-release viewers and partner pages can include it.
    # nginx's add_header does not inherit from the server block once a
    # location declares its own, so the other security headers must be
    # repeated here. X-Frame-Options is omitted and CSP frame-ancestors
    # is set to * to override the server-level DENY.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Mirror the server-level Permissions-Policy. add_header does not
        # inherit once a location block declares its own (nginx footgun).
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        proxy_pass http://site:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
