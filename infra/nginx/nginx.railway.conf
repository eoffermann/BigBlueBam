        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Bureau WebSocket (presence + location_update + summon + knock) ──
    location /bureau/ws {
        set $rw_upstream_24 "bureau-api.railway.internal";
        rewrite ^/bureau/ws(.*)$ /bureau/ws$1 break;
        proxy_pass http://$rw_upstream_24:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Bureau Frontend SPA ─────────────────────────────────────────
    location /bureau/ {
        alias /usr/share/nginx/html/bureau/;
        try_files $uri $uri/ /bureau/index.html;
    }

    # ── LiveKit signal WebSocket (browser-facing) ────────────────────
    # The call widget connects here when LIVEKIT_WS_URL is the relative
    # path /livekit-ws: nginx terminates TLS so https pages get a same-
    # origin wss URL instead of a mixed-content-blocked ws://host:7880.
    # The SDK appends /rtc, /rtc/validate, etc. under this prefix.
    location /livekit-ws/ {
        set $rw_upstream_25 "livekit.railway.internal";
        rewrite ^/livekit-ws/(.*)$ /$1 break;
        proxy_pass http://$rw_upstream_25:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ── Bill Frontend SPA ───────────────────────────────────────────
    location /bill/ {
        alias /usr/share/nginx/html/bill/;
        try_files $uri $uri/ /bill/index.html;
    }

    # ── Bill API proxy ───────────────────────────────────────────
    location /bill/api/ {
        set $rw_upstream_26 "bill-api.railway.internal";
        rewrite ^/bill/api/(.*)$ /$1 break;
        proxy_pass http://$rw_upstream_26:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Bill public invoice pages ────────────────────────────────
    location /invoice/ {
        set $rw_upstream_27 "bill-api.railway.internal";
        rewrite ^/invoice/(.*)$ /invoice/$1 break;
        proxy_pass http://$rw_upstream_27:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Book Frontend SPA ──────────────────────────────────────────
    location /book/ {
        alias /usr/share/nginx/html/book/;
        try_files $uri $uri/ /book/index.html;
    }

    # ── Book API proxy ───────────────────────────────────────────
    location /book/api/ {
        set $rw_upstream_28 "book-api.railway.internal";
        rewrite ^/book/api/(.*)$ /$1 break;
        proxy_pass http://$rw_upstream_28:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Book public booking pages ────────────────────────────────
    location /meet/ {
        set $rw_upstream_29 "book-api.railway.internal";
        rewrite ^/meet/(.*)$ /meet/$1 break;
        proxy_pass http://$rw_upstream_29:8080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── File serving (shared, proxied through BBB API) ────────────
    location /files/ {
        set $rw_upstream_30 "api.railway.internal";
        rewrite ^/files/(.*)$ /files/$1 break;
        proxy_pass http://$rw_upstream_30:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── MCP server ────────────────────────────────────────────────
    # The mcp-server listens on `/mcp` (Streamable HTTP transport) at the
    # upstream. Exact-match locations route `/mcp` and `/mcp/` straight to
    # that upstream path so MCP clients can connect to `https://DOMAIN/mcp/`
    # without suffixing `/mcp`. Subpaths (/mcp/sse, /mcp/messages,
    # /mcp/health, /mcp/tools/call) fall through to the prefix location
    # below, which strips `/mcp/` so the upstream sees `/sse`, `/messages`,
    # `/health`, `/tools/call` — matching apps/mcp-server/src/server.ts.
    location = /mcp {
        set $rw_upstream_31 "mcp-server.railway.internal";
        rewrite ^/mcp(.*)$ /mcp$1 break;
        proxy_pass http://$rw_upstream_31:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    location = /mcp/ {
        set $rw_upstream_32 "mcp-server.railway.internal";
        rewrite ^/mcp/(.*)$ /mcp$1 break;
        proxy_pass http://$rw_upstream_32:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    location /mcp/ {
        set $rw_upstream_33 "mcp-server.railway.internal";
        rewrite ^/mcp/(.*)$ /$1 break;
        proxy_pass http://$rw_upstream_33:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # ── BBB helpdesk-api proxy (for BBB frontend's helpdesk panel) ─
    location /helpdesk-api/ {
        set $rw_upstream_34 "helpdesk-api.railway.internal";
        rewrite ^/helpdesk-api/(.*)$ /$1 break;
        proxy_pass http://$rw_upstream_34:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Documentation static files (in-app Help viewer) ───────────
    # Serves docs/apps/*/guide.md and related assets. The HelpViewer
    # component in each frontend app fetches /docs/apps/{slug}/guide.md.
    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Default profile-picture options, reachable from every SPA. No auth: these
    # are bundled, non-sensitive defaults. User-uploaded avatars go via /files/.
    location /avatars/ {
        alias /usr/share/nginx/html/avatars/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── Static asset caching (exclude API/proxy paths) ────────────
    location ~* ^/(b3|helpdesk|banter|beacon|brief|bolt|bearing|board|bond|blast|blank|blueprint|bureau|book|bench)/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Marketing site (root domain) ──────────────────────────────
    # Everything not claimed by one of the prefix locations above falls
    # through to the site service. Prefix matches (/b3/, /helpdesk/,
    # /banter/, /files/, /mcp/, /helpdesk-api/) take precedence over
    # this plain `/` prefix per nginx's longest-prefix-wins rule.
    #
    # The marketing site is intentionally embeddable in iframes from any
    # origin so press-release viewers and partner pages can include it.
    # nginx's add_header does not inherit from the server block once a
    # location declares its own, so the other security headers must be
    # repeated here. X-Frame-Options is omitted and CSP frame-ancestors
    # is set to * to override the server-level DENY.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Mirror the server-level Permissions-Policy. add_header does not
        # inherit once a location block declares its own (nginx footgun).
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        set $rw_upstream_35 "site.railway.internal";
        proxy_pass http://$rw_upstream_35:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
