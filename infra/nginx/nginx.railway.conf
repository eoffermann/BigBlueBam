    # ── BBB helpdesk-api proxy (for BBB frontend's helpdesk panel) ─
    location /helpdesk-api/ {
        set $rw_upstream_53 "helpdesk-api.railway.internal";
        rewrite ^/helpdesk-api/(.*)$ /$1 break;
        proxy_pass http://$rw_upstream_53:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Documentation static files (in-app Help viewer) ───────────
    # Serves docs/apps/*/guide.md and related assets. The in-app Help Center
    # component in each frontend app fetches /docs/apps/{slug}/
    # help.md and help-index.json.
    #
    # Help CONTENT (.md/.json) is served must-revalidate so a docs edit is
    # visible on the next load instead of being frozen for an hour in the
    # embedded help viewer (which a page hard-reload does NOT refetch). The
    # files carry ETag + Last-Modified, so revalidation is a cheap 304 when
    # nothing changed. This regex location wins over the /docs/ prefix below.
    location ~* ^/docs/.+\.(md|json)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Default profile-picture options, reachable from every SPA. No auth: these
    # are bundled, non-sensitive defaults. User-uploaded avatars go via /files/.
    location /avatars/ {
        alias /usr/share/nginx/html/avatars/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # ── App shell (index.html): always revalidate, never heuristic-cache ──
    # SPA entry documents MUST NOT be cached without revalidation. index.html
    # is served with NO Cache-Control by the SPA prefix locations below, so
    # browsers apply *heuristic* caching (they invent a TTL from the file's
    # age). After a deploy the browser then keeps serving the OLD index.html,
    # which references the OLD hashed bundles it also still holds — the app is
    # frozen at the last-cached version until a hard refresh. That is exactly
    # the Blip "dashboard stuck on 17 July" report (2026-07-24): the data was
    # current server-side; the browser was running a stale shell.
    #
    # `no-cache` = the browser may store it but MUST revalidate every load; a
    # 304 for this small static file is cheap (nginx answers from a stat, no
    # backend hit), so this does not "hammer" anything — it is strictly better
    # than a short max-age, which would still serve staleness within its window
    # and delay every deploy. Hashed assets below stay immutable/1y because
    # their filenames are content-addressed and safe to cache forever.
    #
    # This location declares add_header, so per nginx's non-inheritance rule it
    # must restate the server-level security headers or they are dropped from
    # index.html responses (they are otherwise inherited by the SPA locations).
    # That includes the CSP: every SPA document (direct hits and every deep
    # link that try_files falls back to /<spa>/index.html) is served from
    # here, so without that line no SPA page would carry a CSP at all.
    # The SPA list here and in the assets regex below is checked against every
    # `try_files ... /<spa>/index.html` in this file by scripts/check-nginx-spa-lists.mjs.
    location ~* ^/(b3|helpdesk|banter|beacon|brief|bolt|bearing|board|bond|blast|bill|blank|bin|blip|bay|blueprint|bureau|book|bench|basis|braid|bulwark|burn|bursar|bastion)/index\.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header Content-Security-Policy $bbb_csp always;
        try_files $uri =404;
    }

    # ── Static asset caching (exclude API/proxy paths) ────────────
    location ~* ^/(b3|helpdesk|banter|beacon|brief|bolt|bearing|board|bond|blast|bill|blank|bin|blueprint|bureau|book|bench|basis|braid|bulwark|bay|blip|burn|bursar|bastion)/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Marketing site (root domain) ──────────────────────────────
    # Everything not claimed by one of the prefix locations above falls
    # through to the site service. Prefix matches (/b3/, /helpdesk/,
    # /banter/, /files/, /mcp/, /helpdesk-api/) take precedence over
    # this plain `/` prefix per nginx's longest-prefix-wins rule.
    #
    # The marketing site is intentionally embeddable in iframes from any
    # origin so press-release viewers and partner pages can include it.
    # nginx's add_header does not inherit from the server block once a
    # location declares its own, so the other security headers must be
    # repeated here. X-Frame-Options is omitted and CSP frame-ancestors
    # is set to * to override the server-level DENY.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Mirror the server-level Permissions-Policy. add_header does not
        # inherit once a location block declares its own (nginx footgun).
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        set $rw_upstream_54 "site.railway.internal";
        proxy_pass http://$rw_upstream_54:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
