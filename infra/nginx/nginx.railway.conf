# AUTO-GENERATED by scripts/gen-railway-configs.mjs from
# infra/nginx/nginx-with-site.conf — do not edit by hand. Re-run the
# generator whenever the source nginx config changes:
#
#   node scripts/gen-railway-configs.mjs
#
# What's different from the source:
#   1. Every `proxy_pass http://<service>:<port>` whose hostname matches
#      a service in scripts/deploy/shared/services.mjs is rewritten to
#      `proxy_pass http://<service>.railway.internal:<port>` so the
#      ingress resolves backends through Railway's private DNS instead
#      of the docker-compose bridge network.
#   2. For Bam app services (api, helpdesk-api, mcp-server, …), the
#      upstream port is rewritten to 8080 because Railway sets PORT=8080
#      on every container and the services bind to that, NOT to their
#      docker-compose nominal port (4000, 4001, 3001, …).
#   3. Third-party services (minio, qdrant, livekit) keep their original
#      ports because they ignore $PORT and bind to hardcoded defaults.
#   4. The `listen N;` directive is rewritten to `listen 8080;` so the
#      frontend container binds to Railway's assigned PORT and its own
#      healthcheck passes.
#   5. A `resolver __RESOLVER__ valid=10s;` directive is added to the
#      server block. The entrypoint script replaces __RESOLVER__ with
#      the nameservers from /etc/resolv.conf so nginx resolves upstream
#      hostnames through Railway's DNS at request time (10s TTL)
#      instead of caching the startup IP forever. Without this, any
#      upstream redeploy gives the service a new internal IP and the
#      frontend 502s at that route until it is also redeployed.
#   6. Each proxy_pass upstream hostname is moved into a `set` variable
#      followed by an explicit `rewrite` that reproduces the original
#      URI substitution. nginx only consults the resolver when the
#      proxy_pass URL contains a variable, so a hostname without the
#      `$` indirection would still be statically resolved despite the
#      resolver directive. Trust the generator for these transforms;
#      edit infra/nginx/nginx-with-site.conf (the source) for any real
#      config change.
#
# Strip the port from $host so a redirect from a remapped HTTP_PORT (e.g.
# the operator picked HTTP_PORT=8080 / HTTPS_PORT=8443 to avoid clashing
# with their NAS admin UI) can re-target the correct external HTTPS port
# without inheriting the wrong port from the original Host header. Used by
# the auxiliary redirect server block when TLS_HTTP_MODE=redirect — see
# infra/nginx/tls-redirect.conf.template and entrypoint.sh.
map $host $host_no_port { ~^([^:]+) $1; default $host; }

server {
    # entrypoint.sh fills these in based on cert presence and TLS_HTTP_MODE:
    #   --HTTP-LISTEN--    -> "listen 80;" or "" (omitted on redirect/https-only).
    #   --TLS-LISTEN-BLOCK-- -> "" or listen 443 ssl + ssl_certificate + HSTS lines.
    # (Single-dash form in comments so the awk substitution in entrypoint.sh
    # does not match these references — only the real placeholders below.)
    listen 8080;
    resolver __RESOLVER__ valid=10s;

    server_name _;
    client_max_body_size 25m;

    # ── Relative redirects (Railway / Cloudflare safety) ─────────
    # By default nginx absolutizes every `return 30x /path` into
    # `Location: http://$host:$server_port/path`. On Railway the
    # container listens on PORT=8080, so the absolutized URL becomes
    # `http://bigbluebam.com:8080/path` — Cloudflare can't reach port
    # 8080 on the public hostname and the redirect dies. With
    # `absolute_redirect off`, nginx emits a bare-path Location header
    # that the browser resolves against the original request URL
    # (correct scheme, correct host, no port). This applies to all
    # `return 301`/`return 302` blocks in this file — including the
    # bare-app-prefix helpers below (`location = /b3 { return 301 /b3/; }`)
    # which were the original symptom report. The compose flow stays
    # correct because in that mode the listen port already matches the
    # external port the browser used, so the absolute Location worked
    # by coincidence.
    absolute_redirect off;
    port_in_redirect off;

    # ── Gzip ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml image/svg+xml font/woff2;

    # ── Security Headers ─────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Permissions-Policy: allow same-origin pages to request camera /
    # microphone / display-capture (screen share) for voice + video calls.
    # Previous value was `camera=(), microphone=()` — empty allowlists
    # which the browser reads as "no origin allowed", silently blocking
    # getUserMedia() even after the user clicks Allow on the OS prompt.
    # `(self)` permits our own origin without leaking the grant to
    # embedded iframes.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

    # ── Content-Security-Policy (BugHunt FE-3) ────────────────────
    # The backstop for every stored-XSS bug: `script-src 'self'` with NO
    # 'unsafe-inline' makes an injected <script> or onerror= handler inert
    # even when a sanitizer is bypassed. Keep it that way;
    # scripts/check-csp-hashes.mjs fails if 'unsafe-inline' reaches script-src.
    #
    # Defined ONCE, in $bbb_csp, and emitted by the add_header below. A
    # location that needs a different policy overrides the variable with
    # `set $bbb_csp ...;` (it then still inherits every add_header here). A
    # location that declares its own add_header inherits NONE of these, so it
    # must restate `add_header Content-Security-Policy $bbb_csp always;` (the
    # SPA index.html location near the bottom does). An empty value makes
    # nginx omit the header entirely.
    #
    # Each source is calibrated against the code, not copied from a template:
    #  - 'wasm-unsafe-eval': board's Excalidraw compiles its font-subsetting
    #    wasm, and bay's 3D viewer the meshopt decoder wasm. Permits wasm
    #    compilation only, NOT eval().
    #  - worker-src blob: the bulk CSV import (papaparse `worker: true`)
    #    spawns its worker from a blob URL. Deliberately NOT in script-src,
    #    so an XSS cannot bootstrap itself through a blob.
    #  - style-src 'unsafe-inline': React style={{...}}, Radix/Motion and
    #    CodeMirror inject inline styles. Inline STYLE is a far weaker vector
    #    than inline script, and dropping it breaks every page.
    #  - img-src/media-src https: avatars, user-supplied image URLs, and
    #    short-TTL presigned object-storage URLs (Blip captures); blob:/data:
    #    for generated previews, three.js textures and the Bureau chat blip.
    #  - font-src https://esm.sh: Excalidraw (board) loads its hand-drawn
    #    fonts from esm.sh because EXCALIDRAW_ASSET_PATH is not set.
    #  - connect-src ws: wss: the per-app WS hubs plus the LiveKit signal
    #    socket, which is a different port (7880) or a different host
    #    (LIVEKIT_WS_URL) so 'self' cannot cover it. http:/https: for
    #    LiveKit's HEAD reachability probes against that same host; blob:
    #    and data: for three.js GLTF texture/buffer fetches.
    #  - frame-src https: board sets validateEmbeddable, so a user may embed
    #    any https page on a whiteboard.
    #  - object-src 'none' + base-uri 'self' kill <object>/<embed> and <base>
    #    hijacking, neither of which the suite uses.
    #
    # Locations that do NOT carry this policy: /forms/ (Blank's server-
    # rendered public forms, which run their own inline script and Turnstile)
    # and the marketing-site `location /` at the bottom of this file, which
    # declares its own add_header set (CSP frame-ancestors *).
    set $bbb_csp "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https://esm.sh; media-src 'self' data: blob: https:; connect-src 'self' ws: wss: https: http: blob: data:; frame-src 'self' https:";
    add_header Content-Security-Policy $bbb_csp always;

    # ── ACME HTTP-01 challenge (Let's Encrypt) ────────────────────
    # Always present so the same nginx config works for all TLS modes;
    # the path is unused unless the certbot sidecar (compose profile
    # "letsencrypt") is running and writing challenge tokens.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── App-prefix redirect helpers ─────────────────────────────────
    # nginx's prefix matching is strict: `location /b3/` does NOT match
    # `/b3` (no trailing slash). Without these exact-match redirects, a
    # user hitting `http://host/b3` falls through to `location /` which
    # proxies to the marketing site, which then redirects to `/` — the
    # symptom users reported as "going to /b3 from a LAN client always
    # bounces to root." Each `location = /<app>` returns a 301 to the
    # canonical trailing-slash form. `$request_uri` preserves any query
    # string the user landed with.
    location = /b3       { return 301 /b3/; }
    location = /banter   { return 301 /banter/; }
    location = /beacon   { return 301 /beacon/; }
    location = /brief    { return 301 /brief/; }
    location = /bolt     { return 301 /bolt/; }
    location = /bearing  { return 301 /bearing/; }
    location = /board    { return 301 /board/; }
    location = /bond     { return 301 /bond/; }
    location = /blast    { return 301 /blast/; }
    location = /bench    { return 301 /bench/; }
    location = /blank    { return 301 /blank/; }
    location = /bin      { return 301 /bin/; }
    location = /blueprint { return 301 /blueprint/; }
    location = /bureau   { return 301 /bureau/; }
    location = /bill     { return 301 /bill/; }
    location = /book     { return 301 /book/; }
    location = /helpdesk { return 301 /helpdesk/; }

    # ── Authoritative Bam SPA paths under the root ─────────────────
    # The auth/onboarding pages live inside the Bam SPA which is
    # mounted at /b3/. Some emails (older builds, or installs that
    # misconfigured PUBLIC_URL to the site root) ship URLs without
    # the /b3 prefix — e.g. https://example.com/password-reset?token=…
    # Without these rewrites the request lands on the marketing
    # site's catch-all index.html and the user sees the home page
    # instead of the password-reset form. (2026-06-11 invite incident.)
    # Order matters — these run BEFORE the catch-all site fallback.
    rewrite ^/password-reset(/?)$         /b3/password-reset$is_args$args  last;
    rewrite ^/password-change(/?)$        /b3/password-change$is_args$args last;
    rewrite ^/login(/?)$                  /b3/login$is_args$args           last;
    rewrite ^/register(/?)$               /b3/register$is_args$args        last;
    rewrite ^/bootstrap(/?)$              /b3/bootstrap$is_args$args       last;
    rewrite ^/verify-email/(.+)$          /b3/verify-email/$1$is_args$args last;
    rewrite ^/guests/accept/(.+)$         /b3/guests/accept/$1$is_args$args last;

    # ── Internal service-to-service routes: never reachable from outside ──
    # Every /<app>/api/ proxy strips its prefix, so /<app>/api/internal/* and
    # /<app>/api/v1/internal/* would reach the upstream's server-to-server
    # routes (guarded only by a secret ~25 services share). Satellites call
    # each other directly over the private network, never through this edge,
    # so these 404 here (#226; Bastion spec 2.8). Regex locations beat every
    # prefix location below, and nginx matches the decoded, slash-merged URI,
    # so %69nternal and // variants are caught too. The only exceptions are
    # the api's browser-facing, session-authed routes that live under
    # /internal/ (SystemErrorReporter, the Bam helpdesk agent proxy).
    # scripts/check-nginx-spa-lists.mjs fails when this drifts.
    location ~* ^/b3/api/(?:v1/)?internal(?:/|$)(?!(?:system-errors/record-browser|helpdesk/queue|helpdesk/tickets/[^/]+(?:/messages)?)/?$) {
        return 404;
    }
    location ~* ^/(?:(?!b3/)[^/]+/api|helpdesk-api|mcp)/(?:v1/)?internal(?:/|$) {
        return 404;
    }
    # /mcp/tools/call is the mcp-server's shared-secret S2S invocation route
    # (a full-authority service account). The /mcp/ prefix location strips the
    # prefix and would forward it; this regex outranks that prefix. Its callers
    # (worker bolt-execute) use MCP_INTERNAL_URL directly (#246).
    location ~* ^/mcp/tools/call/?$ {
        return 404;
    }

    # ── BBB Frontend SPA ──────────────────────────────────────────
    location /b3/ {
        alias /usr/share/nginx/html/b3/;
        try_files $uri $uri/ /b3/index.html;
    }

    # ── BBB API proxy ─────────────────────────────────────────────
    location /b3/api/ {
        set $rw_upstream_1 "api.railway.internal";
        rewrite ^/b3/api/(.*)$ /$1 break;
        proxy_pass http://$rw_upstream_1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── BBB WebSocket ─────────────────────────────────────────────
    location /b3/ws {
