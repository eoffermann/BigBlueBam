# Dev overlay. Every published port is bound to 127.0.0.1 (#276): these are developer-host
# conveniences that bypass nginx, so they must never listen on a LAN or public interface.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: ["npx", "tsx", "watch", "src/server.ts"]
    volumes:
      - ./apps/api/src:/app/apps/api/src
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: development
      # BAM-RL-E2E: dev stacks always run permissive so Playwright workers
      # can run in parallel without hitting HTTP 429.
      BBB_E2E_PERMISSIVE_RATE_LIMIT: "1"

  helpdesk-api:
    build:
      context: .
      dockerfile: apps/helpdesk-api/Dockerfile
      target: dev
    command: ["npx", "tsx", "watch", "src/server.ts"]
    volumes:
      - ./apps/helpdesk-api/src:/app/apps/helpdesk-api/src
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      NODE_ENV: development
      # BAM-RL-E2E: dev stacks always run permissive so Playwright workers
      # can run in parallel without hitting HTTP 429.
      BBB_E2E_PERMISSIVE_RATE_LIMIT: "1"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: deps
    command: ["pnpm", "dev", "--host", "0.0.0.0"]
    volumes:
      - ./apps/frontend:/app/apps/frontend
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      NODE_ENV: development

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    command: ["npx", "tsx", "watch", "src/worker.ts"]
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
    environment:
      NODE_ENV: development

  banter-api:
    build:
      context: .
      dockerfile: apps/banter-api/Dockerfile
      target: dev
    command: ["npx", "tsx", "watch", "src/server.ts"]
    volumes:
      - ./apps/banter-api/src:/app/apps/banter-api/src
    ports:
      - "127.0.0.1:4002:4002"
    environment:
      NODE_ENV: development

  bearing-api:
    build:
      context: .
      dockerfile: apps/bearing-api/Dockerfile
      target: dev
    command: ["npx", "tsx", "watch", "src/server.ts"]
    volumes:
      - ./apps/bearing-api/src:/app/apps/bearing-api/src
    ports:
      - "127.0.0.1:4007:4007"
    environment:
      NODE_ENV: development

  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
      target: dev
    command: ["npx", "tsx", "watch", "src/server.ts"]
    volumes:
      - ./apps/mcp-server/src:/app/apps/mcp-server/src
    environment:
      NODE_ENV: development
