name: Lint

# Closes Platform_Plan.md (2026-04-13-revised) gap 2.2.1.
#
# Runs Biome / per-package linters across the workspace plus the migration
# header / idempotency check on every push and PR. The repo currently uses
# a mix of Biome (frontends) and ESLint (api services); the root `pnpm lint`
# script delegates to `turbo run lint` which fans out to whichever tool each
# package has registered.

on:
  pull_request:
  push:
    branches: [main, stable, suite-brainstorm]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: Lint workspace
    runs-on: ubuntu-latest
    # Normally about 1 min (#235).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22 and pnpm
        # Corepack activates the pnpm pinned by package.json packageManager (issues #190, #197).
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      # Issue #132: Biome warnings never fail `pnpm lint`, so this ratchet does. Fails when
      # any package's warning count differs from scripts/biome-warning-budget.json in either
      # direction (issue #150: a decrease must be locked in by the PR that made it), or when
      # the baseline names a package that no longer exists. Refresh the baseline with
      # `node scripts/check-biome-budget.mjs --update` after cleaning a package.
      - name: Biome warning budget
        run: pnpm check:biome-budget

      - name: Lint migration files
        run: pnpm lint:migrations

      # Issue #235: every workflow job sets timeout-minutes, so a hang fails fast instead of
      # holding its lane (and the next push's run) for GitHub's 360-minute default.
      - name: Workflow job timeouts
        run: pnpm check:workflow-timeouts

      - name: Check permission catalog drift
        run: pnpm check:permission-catalog

      # Bolt event-catalog drift guard: every publishBoltEvent(source, event_type) call site
      # must be declared in apps/bolt-api/src/services/event-catalog.ts. Exists at
      # package.json but ran in no workflow until this build wired it in (Burn spec 8.2).
      - name: Check bolt event catalog drift
        run: pnpm check:bolt-catalog

      # Deploy/infra script unit tests written with node:test (no vitest config is
      # needed, since scripts/ sits outside the pnpm workspace). Covers the Railway nginx
      # generator transform, the syncNew variable reconcile, and the stable-secret class.
      - name: Script unit tests (node:test)
        run: pnpm test:scripts

      # Issue #135: the older scripts/deploy/shared vitest suite (deploy catalog, env
      # hints, Railway orchestration, TLS) ran in no workflow. scripts/ is outside the
      # workspace, so it borrows the api package's vitest binary; tls.test.mjs shells out
      # to openssl, which ubuntu-latest ships.
      - name: Deploy script unit tests (vitest)
        run: pnpm test:deploy

      # Issue #127: the index.html no-cache and assets-cache regexes in every nginx
      # config must list exactly the SPAs that config serves (and every Launchpad app).
      - name: Check nginx SPA lists
        run: pnpm check:nginx-spa

      # Issue #198: a recursive chown in an app Dockerfile duplicates node_modules
      # into a second layer and takes over an hour on slow Docker disks.
      - name: Check Dockerfiles use COPY --chown
        run: pnpm check:dockerfile-chown

      # Guards scripts/deploy/shared/env-hints.mjs against catalog vars that have
      # no hint. An unhinted OPTIONAL var is silently dropped from the Railway
      # service (the integration is just absent in prod, with no signal); an
      # unhinted REQUIRED var throws and aborts provisioning for that service.
      # Note that scripts/ is outside the pnpm workspace, so the deploy/shared
      # vitest suite runs nowhere -- this is a plain node script for that reason,
      # matching how db-drift.yml invokes scripts/db-check.coverage.test.mjs.
      - name: Check env-hints coverage
        run: pnpm check:env-hints

      - name: Check help index drift
        run: pnpm help:check

      # Launchpad completeness gate: the Launchpad is the suite's "ready for
      # consumption" contract, so an app may appear in LAUNCHPAD_CATALOG only once
      # it is complete to the suite-common standard (MCP tools, help doc + index,
      # marketing section, User-Story screenshots). An app that lands in the
      # Launchpad half-built (or whose autonomous build died mid-flight) hard-fails
      # here on purpose - it must not reach a user. The autonomous loop treats this
      # red as a trigger to resume engineering on the app, not to weaken the gate.
      - name: Check Launchpad app completeness
        run: pnpm check:app-completeness

      - name: Check docs catalog drift
        run: pnpm docs:catalog:check

      # Issue #147: the Bolt action editor's typed MCP parameter picker reads this committed
      # generated file; it silently drifted to 273 of 885 tools before this check existed.
      - name: Check MCP tool schema drift
        run: pnpm check:mcp-tool-schemas

      - name: Check docs manual drift
        run: pnpm docs:manual:check

      # README app-catalog drift guard: the README's AUTODOCS:APP_SECTIONS region is
      # generated (scripts/docs/publish.mjs) so the repo front door always shows the whole
      # suite - every shipped app with a description, a screencap, and a link to its
      # docs/apps/<app>/help.md - without a trip to the marketing site. Fails if the
      # committed README lags the roster.
      - name: Check README app-catalog drift
        run: pnpm docs:readme:check
