name: Lint

# Closes Platform_Plan.md (2026-04-13-revised) gap 2.2.1.
#
# Runs Biome / per-package linters across the workspace plus the migration
# header / idempotency check on every push and PR. The repo currently uses
# a mix of Biome (frontends) and ESLint (api services); the root `pnpm lint`
# script delegates to `turbo run lint` which fans out to whichever tool each
# package has registered.

on:
  pull_request:
  push:
    branches: [main, stable, suite-brainstorm]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: Lint workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Lint migration files
        run: pnpm lint:migrations

      - name: Check permission catalog drift
        run: pnpm check:permission-catalog

      # Bolt event-catalog drift guard: every publishBoltEvent(source, event_type) call site
      # must be declared in apps/bolt-api/src/services/event-catalog.ts. Exists at
      # package.json but ran in no workflow until this build wired it in (Burn spec 8.2).
      - name: Check bolt event catalog drift
        run: pnpm check:bolt-catalog

      # Guards scripts/deploy/shared/env-hints.mjs against catalog vars that have
      # no hint. An unhinted OPTIONAL var is silently dropped from the Railway
      # service (the integration is just absent in prod, with no signal); an
      # unhinted REQUIRED var throws and aborts provisioning for that service.
      # Note that scripts/ is outside the pnpm workspace, so the deploy/shared
      # vitest suite runs nowhere -- this is a plain node script for that reason,
      # matching how db-drift.yml invokes scripts/db-check.coverage.test.mjs.
      - name: Check env-hints coverage
        run: pnpm check:env-hints

      - name: Check help index drift
        run: pnpm help:check

      # Launchpad completeness gate: the Launchpad is the suite's "ready for
      # consumption" contract, so an app may appear in LAUNCHPAD_CATALOG only once
      # it is complete to the suite-common standard (MCP tools, help doc + index,
      # marketing section, User-Story screenshots). An app that lands in the
      # Launchpad half-built (or whose autonomous build died mid-flight) hard-fails
      # here on purpose - it must not reach a user. The autonomous loop treats this
      # red as a trigger to resume engineering on the app, not to weaken the gate.
      - name: Check Launchpad app completeness
        run: pnpm check:app-completeness

      - name: Check docs catalog drift
        run: pnpm docs:catalog:check

      - name: Check docs manual drift
        run: pnpm docs:manual:check
