name: Typecheck

# Closes Platform_Plan.md (2026-04-13-revised) gap 2.2.2.
#
# Runs `tsc --noEmit` across every workspace package on every push and PR.
# Uses `pnpm -r --parallel typecheck --if-present` so a package without a
# typecheck script (e.g. packages/ui has no own tsconfig and is consumed
# via Vite alias) does not break the run. Every package that has a
# tsconfig is expected to have a typecheck script.

on:
  pull_request:
  push:
    branches: [main, stable, suite-brainstorm]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsc:
    name: tsc --noEmit (all packages)
    runs-on: ubuntu-latest
    # Normally 3 to 4 min; one run hung 27 min in Run typecheck (#235).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22 and pnpm
        # Corepack activates the pnpm pinned by package.json packageManager (issues #190, #197).
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        # Every workspace package under packages/ that exports from ./dist
        # needs to be built before tsc consumers can resolve their types.
        # --if-present skips packages (like @bigbluebam/ui) that are
        # source-only and consumed via bundler path resolution.
        run: pnpm -r --filter './packages/*' --if-present run build

      - name: Run typecheck
        # Step-level too, so a hang is attributed to this step in the UI (#235).
        timeout-minutes: 15
        run: pnpm -r --parallel --if-present typecheck

      - name: Typecheck test code
        # Package tsconfigs exclude test/ so builds ship only src; this checks src + test for every
        # package whose test/ directory its tsconfig leaves out, auto-discovered (#337).
        timeout-minutes: 15
        run: |
          node scripts/typecheck-tests.coverage.test.mjs
          pnpm typecheck:tests
