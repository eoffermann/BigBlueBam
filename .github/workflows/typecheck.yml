name: Typecheck

# Closes Platform_Plan.md (2026-04-13-revised) gap 2.2.2.
#
# Runs `tsc --noEmit` across every workspace package on every push and PR.
# Uses `pnpm -r --parallel typecheck --if-present` so a package without a
# typecheck script (e.g. packages/ui has no own tsconfig and is consumed
# via Vite alias) does not break the run. Every package that has a
# tsconfig is expected to have a typecheck script.

on:
  pull_request:
  push:
    branches: [main, stable, suite-brainstorm]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsc:
    name: tsc --noEmit (all packages)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        # Every workspace package under packages/ that exports from ./dist
        # needs to be built before tsc consumers can resolve their types.
        # --if-present skips packages (like @bigbluebam/ui) that are
        # source-only and consumed via bundler path resolution.
        run: pnpm -r --filter './packages/*' --if-present run build

      - name: Run typecheck
        run: pnpm -r --parallel --if-present typecheck
