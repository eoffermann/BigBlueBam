name: Test

# Closes Platform_Plan.md (2026-04-13-revised) gap 2.2.3.
#
# Runs Vitest across every workspace package on every push and PR. A
# Postgres 16 service container and a Redis 7 service container are
# provided so the API packages that hit a real DB can connect; hermetic
# unit tests are unaffected. Migrations are applied with psql before the
# Vitest run so the schema is in place for any test that queries it.
#
# E2E (Playwright) coverage lives in a separate integration workflow
# (gap 2.2.4, deferred) because it requires the full docker-compose stack.

on:
  pull_request:
  push:
    branches: [main, stable]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest

    # Sharded so no single runner runs all ~40 workspace suites at once. Running
    # them all in parallel on one runner starved DB-setup hooks and produced
    # "Hook timed out" false-reds that varied run-to-run. Each shard gets its own
    # Postgres/Redis service and runs its subset of packages serially.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bigbluebam
          POSTGRES_USER: bigbluebam
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bigbluebam -d bigbluebam"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bigbluebam:postgres@localhost:5432/bigbluebam
      REDIS_URL: redis://localhost:6379
      PGPASSWORD: postgres
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared + api packages
        # Every workspace package under packages/ that exports from ./dist
        # needs to be built before vitest runs, or api-side tests will fail
        # with "Failed to resolve entry for package ..." when they import
        # @bigbluebam/db-stubs and similar. --if-present skips packages
        # (like @bigbluebam/ui) that have no build script.
        run: |
          pnpm -r --filter './packages/*' --if-present run build
          pnpm --filter @bigbluebam/api build

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U bigbluebam -d bigbluebam; then exit 0; fi
            sleep 1
          done
          echo "postgres never became ready" >&2
          exit 1

      - name: Apply migrations (via migrate runner)
        # The runner handles the superuser sentinel bootstrap that unblocks
        # 0023_beacon_tables on fresh DBs; see apps/api/src/migrate.ts.
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/infra/postgres/migrations
        run: node apps/api/dist/migrate.js

      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: 4
        run: |
          # Deterministically round-robin every workspace package that has a
          # test script across the shards, then run this shard's packages one at
          # a time. Serial within a shard keeps DB-setup hooks from contending,
          # which is what caused the flaky "Hook timed out" reds.
          mapfile -t PKGS < <(node -e '
            const fs = require("fs");
            const names = [];
            for (const base of ["apps", "packages"]) {
              if (!fs.existsSync(base)) continue;
              for (const d of fs.readdirSync(base)) {
                const pj = `${base}/${d}/package.json`;
                if (!fs.existsSync(pj)) continue;
                let j; try { j = JSON.parse(fs.readFileSync(pj, "utf8")); } catch { continue; }
                if (j.scripts && j.scripts.test) names.push(j.name);
              }
            }
            names.sort();
            const shard = Number(process.env.SHARD), total = Number(process.env.TOTAL);
            names.filter((_, i) => i % total === shard - 1).forEach((n) => console.log(n));
          ')
          echo "Shard ${SHARD}/${TOTAL} packages: ${PKGS[*]}"
          if [ ${#PKGS[@]} -eq 0 ]; then echo "no packages in this shard"; exit 0; fi
          fail=0
          for p in "${PKGS[@]}"; do
            echo "::group::$p"
            pnpm --filter "$p" --if-present run test || fail=1
            echo "::endgroup::"
          done
          exit $fail
