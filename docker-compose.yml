      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
      - frontend

  qdrant:
    <<: *common
    image: qdrant/qdrant:latest
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # MailHog: a catch-all SMTP server for local development that captures every
  # outgoing message and lets you browse them via a tiny web UI. Gated behind
  # the "mailhog" compose profile so production / CI flows don't pay the cost
  # by default. Bring up with: `docker compose --profile mailhog up -d mailhog`
  # then point SMTP at host:1025 (no auth) or browse http://localhost:8025 to
  # see what was sent.
  mailhog:
    <<: *common
    profiles: ["mailhog"]
    image: mailhog/mailhog:latest
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - backend

  # Let's Encrypt sidecar. Gated behind the "letsencrypt" compose profile so
  # it only spins up when the operator picked that cert source. Issues the
  # initial cert via webroot challenge against nginx (the frontend service
  # serves /.well-known/acme-challenge/ unconditionally) and writes certs to
  # ./certs/letsencrypt/, which the deploy script symlinks into
  # ./certs/local.{crt,key} for nginx to pick up. Renewal is driven by a
  # host-side cron entry the deploy script writes — NOT by an in-container
  # loop, because that would require mounting the docker socket into this
  # sidecar (anti-pattern; see docs/guides/local-ssl-notes.md).
  certbot:
    image: certbot/certbot:latest
    profiles: ["letsencrypt"]
    volumes:
      - ./certs/letsencrypt:/etc/letsencrypt
      - ./certs/acme-challenge:/var/www/certbot
    # The deploy script invokes certbot with explicit args via
    # `docker compose run --rm certbot ...` so this default command is just
    # a safe no-op for a manual `docker compose up certbot`.
    entrypoint: ["sh", "-c"]
    command: ["echo 'certbot sidecar ready; invoke via docker compose run --rm certbot'"]

  # ── LiveKit config renderer (one-shot, runs before livekit) ──────────
  # Re-renders infra/livekit/livekit.yaml on EVERY `docker compose up`:
  # re-detects the public (WAN) IP via STUN so a rotated address never
  # goes stale, reads the host LAN IP persisted by the deploy script /
  # `node scripts/livekit/render-config.mjs`, and reports the network
  # topology (behind NAT? required port-forwards?) to the platform
  # system_errors Log so any deployer can troubleshoot connectivity from
  # the SuperUser Log Analysis tab. Same depends_on pattern as migrate.
  livekit-config:
    image: node:22-alpine
    command: ["node", "/scripts/render-config.mjs", "--mode=container"]
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_NODE_IP: ${LIVEKIT_NODE_IP:-auto}
      LIVEKIT_EXTERNAL_IP: ${LIVEKIT_EXTERNAL_IP:-auto}
      LIVEKIT_UDP_PORT_RANGE: ${LIVEKIT_UDP_PORT_RANGE:-51000-51100}
      LIVEKIT_TURN_DOMAIN: ${LIVEKIT_TURN_DOMAIN:-}
      LIVEKIT_TURN_CERT_FILE: ${LIVEKIT_TURN_CERT_FILE:-}
      LIVEKIT_TURN_KEY_FILE: ${LIVEKIT_TURN_KEY_FILE:-}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      BBB_API_INTERNAL_URL: http://api:4000
      LIVEKIT_WORK_DIR: /work
    volumes:
      - ./scripts/livekit:/scripts:ro
      - ./infra/livekit:/work
    restart: "no"
    networks:
      - backend

  livekit:
    <<: *common
    image: livekit/livekit-server:latest
    # Directory mount (not a single-file mount) so the livekit-config
    # render lands without inode/file-vs-directory bind-mount traps —
    # this also retires the historic "Docker created a directory named
    # livekit.yaml on first boot" gotcha, since the config now always
    # exists before this container starts.
    command: --config /etc/livekit/livekit.yaml
    depends_on:
      livekit-config:
        condition: service_completed_successfully
    ports:
      # Overridable by the advanced-port-mapping flow in scripts/deploy/main.mjs;
      # defaults match the upstream LiveKit defaults so existing installs
      # are unaffected. Container-internal ports stay at 7880/7881.
      - "${LIVEKIT_RTC_PORT:-7880}:7880"
      - "${LIVEKIT_TCP_PORT:-7881}:7881"
      # WebRTC media (UDP). Without this range mapped to the host, the
      # only media path is the TCP fallback on 7881 — and any browser
      # whose ICE-candidate list points at the host's IP can't reach
      # the UDP ports at all. Symptom of leaving this out: the second
      # LAN device sees "[R] In: <Room> error" with a ConnectionError
      # from LiveKit's Room.connect(). The SAME env var drives the
      # rendered rtc.port_range_start/end (via livekit-config), so the
      # mapping and the advertised ports cannot drift apart. Both sides
      # of the mapping must be identical — WebRTC advertises the
      # container-local port numbers, so an offset mapping would
      # advertise ports the host doesn't listen on.
      - "${LIVEKIT_UDP_PORT_RANGE:-51000-51100}:${LIVEKIT_UDP_PORT_RANGE:-51000-51100}/udp"
      # TURN over TLS (only active when LIVEKIT_TURN_DOMAIN + cert/key
      # env vars are set; otherwise LiveKit doesn't listen and the
      # mapping is inert).
      - "${LIVEKIT_TURN_TLS_PORT:-5349}:5349"
    volumes:
      - ./infra/livekit:/etc/livekit:ro
      # TLS material for the optional TURN listener; harmless empty dir
      # when TURN is off.
      - ./certs:/certs:ro
    networks:
      - backend
      - frontend

  voice-agent:
    <<: *common
    build:
      context: .
      dockerfile: apps/voice-agent/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      AGENT_SYSTEM_PROMPT: ${AGENT_SYSTEM_PROMPT:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - backend

  # ── One-shot migration runner ─────────────────────────────────────────────
  # Reads infra/postgres/migrations/ and applies any unapplied SQL files in
  # filename order. Tracks applied migrations in the `schema_migrations`
  # table with a SHA-256 checksum per file (header comments stripped before
  # hashing so editing -- Why / -- Client impact lines does not invalidate
  # an applied migration). Idempotent: rerunning is a no-op when the DB is
  # already up to date. Every DB-using service declares this as a
  # `service_completed_successfully` dependency so migrations ALWAYS run
  # before app code that assumes the current schema.
  #
  # GOTCHA: the sidecar is cached on subsequent `docker compose up -d`.
  # `service_completed_successfully` dependencies are evaluated against the
  # FIRST successful exit on a given stack lifetime. Once `migrate` has run
  # to completion, subsequent `docker compose up -d <service>` invocations
  # see the cached completion and DO NOT re-run the sidecar even if you
  # just dropped a new SQL file into infra/postgres/migrations/. Simply
  # rebuilding `bolt-api` (or any other dependent service) will not trigger
  # the migration. Run the sidecar explicitly:
  #
  #   docker compose run --rm migrate                              # apply new migrations
  #   docker compose build <app-that-uses-the-new-column>          # rebuild affected app
  #   docker compose up -d --force-recreate <app>                  # restart it
  #
  # See CLAUDE.md "Applying a new migration to a long-running stack" for
  # the full incident history (template_strict, bolt_graph_column,
  # bond_deal_rotting_alerted) and verification commands.
  #
  # NOTE ON THE BIND MOUNT: `infra/postgres/migrations` is also COPYed into
  # the production image by apps/api/Dockerfile so Helm/k8s deployments ship
  # a self-contained image. For `docker compose` on developer hosts (esp.
  # Windows/WSL2 where the build context has been observed to silently drop
  # newly-added SQL files from COPY layers), the bind mount below overrides
  # the baked-in `/app/migrations` directory with the live host tree. This
  # makes new migration files available to `docker compose run --rm migrate`
  # instantly without a rebuild and bypasses the WSL2 file-sync class of
  # bugs that caused migrations 0043/0044/0045 to be silently missing from
  # the image earlier in development. Mounted read-only so the container
  # cannot corrupt host source.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/bigbluebam
      MIGRATIONS_DIR: /app/migrations
    volumes:
      - ./infra/postgres/migrations:/app/migrations:ro
    restart: "no"
    networks:
      - backend

  # ── One-shot seed runner (opt-in via --profile seed) ─────────────────────
  # Reuses the api production image (has node + argon2 + postgres-js in
  # /app/node_modules) and runs scripts/seed-all.mjs as the entry point.
  # The scripts/ directory is bind-mounted live, mirroring the migrate
  # sidecar, so new seed files are visible without a rebuild.
  #
  # Invocation:
  #   docker compose --profile seed run --rm seed
  #
  # The profile tag keeps this out of the normal `docker compose up -d`
  # lifecycle; it only runs when the `seed` profile is explicitly
  # selected. Depends on migrate completing and api being healthy so we
  # know the schema is current before inserting anything.
  seed:
    profiles: ["seed"]
    image: bigbluebam-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    command: ["node", "/app/scripts/seed-all.mjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/bigbluebam
      SEED_ORG_SLUG: ${SEED_ORG_SLUG:-}
      BOLT_API_INTERNAL_URL: http://bolt-api:4006
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
    volumes:
      - ./scripts:/app/scripts:ro
    restart: "no"
    networks:
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
  qdrantdata:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
