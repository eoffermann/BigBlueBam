    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bigbluebam}
      - DATABASE_READ_URL=${DATABASE_READ_URL:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - BBB_API_INTERNAL_URL=http://api:4000
      - BIN_API_INTERNAL_URL=http://bin-api:4016
      - BOLT_API_INTERNAL_URL=http://bolt-api:4006
      - NODE_ENV=production
      - PORT=4018
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost}
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW_MS=60000
      # Wave D Phase 3: per-action permission enforcement at this satellite.
      - BBB_PERMISSIONS_ENFORCE=${BBB_PERMISSIONS_ENFORCE:-warn}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # Server-side pepper mixed into the public ingest endpoint's token/HMAC
      # so inbound /blip/ingest/ payloads can be verified without a session.
      - BLIP_INGEST_PEPPER=${BLIP_INGEST_PEPPER:-blip-dev-ingest-pepper-change-me}
      # Object store — shares Bin's bucket + keys.
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
