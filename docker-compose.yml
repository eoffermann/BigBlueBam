x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ── Infrastructure ──────────────────────────────────────────────
  postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bigbluebam
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bigbluebam} -d bigbluebam"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  redis:
    <<: *common
    image: redis:7-alpine
    # maxmemory-policy MUST be noeviction: this instance backs BullMQ job
    # queues, and eviction under memory pressure silently corrupts queue
    # state (BullMQ warns on every connection otherwise). At the cap,
    # writes error out instead — visible and recoverable, unlike lost jobs.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  minio:
    <<: *common
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - backend

  # ── Application ─────────────────────────────────────────────────
  api:
    <<: *common
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/bigbluebam
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-bigbluebam-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${SMTP_FROM:-noreply@bigbluebam.com}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      # env.ts auto-promotes COOKIE_SECURE to true whenever NODE_ENV=production
      # (which it always is in this image). Browsers silently drop a Secure
      # cookie sent over plain HTTP, so the session cookie never comes back
      # and the SPA bounces straight to /login. Wire it explicitly with a
      # safe HTTP-only default; TLS deploys set COOKIE_SECURE=true in .env.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Per-action permissions (Waves A-E). Default 'warn' starts the
      # divergence-soak window: legacy gates remain canonical, the new
      # resolver runs alongside on annotated routes, mismatches land in
      # permissions_divergence_log. See docs/permissions-overhaul-plan.md.
      # Flip to 'on' only after the SuperUser dashboard is clean for the
      # configured soak duration.
      BBB_PERMISSIONS_ENFORCE: ${BBB_PERMISSIONS_ENFORCE:-warn}
      INTERNAL_HELPDESK_SECRET: ${INTERNAL_HELPDESK_SECRET:?INTERNAL_HELPDESK_SECRET is required}
      # Wave D Phase 2/3: satellites + mcp-server POST to /internal/permissions/
      # dual-read with this shared secret. Without it, the api only accepts
      # the helpdesk secret, every satellite resolver call returns 401, and
      # mode=on falls back to "unknown" → pass-through → enforcement no-op.
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      # BAM-RL-E2E: opt-in flag to multiply the global rate limit ceiling for
      # parallel e2e runs. Leave unset on real production deployments.
      BBB_E2E_PERMISSIVE_RATE_LIMIT: ${BBB_E2E_PERMISSIVE_RATE_LIMIT:-}
      RATE_LIMIT_E2E_MULTIPLIER: ${RATE_LIMIT_E2E_MULTIPLIER:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - frontend

  mcp-server:
    <<: *common
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
      target: production
    # Published for local MCP clients (e.g. Claude Code): the nginx route
    # at https://localhost/mcp/ serves a self-signed cert that Node-based
    # clients reject, so they connect straight to the container instead
    # (http://localhost:3001/). Production stays nginx-only — this mapping
    # is a developer-host convenience.
    ports:
      - '${MCP_PORT:-3001}:3001'
    depends_on:
      api:
        condition: service_healthy
      bearing-api:
        condition: service_healthy
      bill-api:
        condition: service_healthy
      blank-api:
        condition: service_healthy
      blueprint-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MCP_PORT: ${MCP_PORT:-3001}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-streamable-http}
      API_INTERNAL_URL: http://api:4000
      HELPDESK_API_URL: http://helpdesk-api:4001
      BANTER_API_URL: http://banter-api:4002
      BEACON_API_URL: http://beacon-api:4004/v1
      BRIEF_API_URL: http://brief-api:4005/v1
      BOLT_API_URL: http://bolt-api:4006/v1
      BEARING_API_URL: http://bearing-api:4007/v1
      BOARD_API_URL: http://board-api:4008/v1
      BOND_API_URL: http://bond-api:4009/v1
      BLAST_API_URL: http://blast-api:4010/v1
      BLUEPRINT_API_URL: http://blueprint-api:4015/v1
      BOOK_API_URL: http://book-api:4012/v1
      BENCH_API_URL: http://bench-api:4011/v1
      BASIS_API_URL: http://basis-api:4019/v1
      BRAID_API_URL: http://braid-api:4020/v1
      BULWARK_API_URL: http://bulwark-api:4021/v1
      BURN_API_URL: http://burn-api:4022/v1
      BILL_API_URL: http://bill-api:4014/v1
      BLANK_API_URL: http://blank-api:4013/v1
      BIN_API_URL: http://bin-api:4016/v1
      BAY_API_URL: http://bay-api:4017/v1
      BLIP_API_URL: http://blip-api:4018/v1
      BUREAU_API_URL: http://bureau-api:4015/v1
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      MCP_INTERNAL_API_TOKEN: ${MCP_INTERNAL_API_TOKEN:-}
      # Wave D Phase 2: per-action enforcement at the MCP layer. 'warn' runs
      # the resolver after §15 PolicyGate accepts and records divergence;
      # 'on' additionally returns PERMISSION_DENIED on resolver-deny. Flip
      # to 'on' only after the divergence dashboard sits at ~0 for the
      # configured soak window. Always-permitted core tools bypass.
      BBB_PERMISSIONS_ENFORCE: ${BBB_PERMISSIONS_ENFORCE:-warn}
      # The resolver lives on the api side; checkPermissionViaResolver hits
      # this URL via POST /internal/permissions/dual-read.
      BBB_API_INTERNAL_URL: http://api:4000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - frontend

  worker:
    <<: *common
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/bigbluebam
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-bigbluebam-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${SMTP_FROM:-noreply@bigbluebam.com}
      # worker builds outbound campaign tracking/pixel/unsub links from this
      # bare root (blast-send.job.ts appends /t/o, /t/c, /unsub). Matches blast-api.
      TRACKING_BASE_URL: ${PUBLIC_URL:-http://localhost}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      BOLT_API_INTERNAL_URL: http://bolt-api:4006
      # Book task #63: the book-calendar-sync sweep calls the Book API's
      # internal sync-due route to run the external-calendar sync engine.
      BOOK_API_INTERNAL_URL: http://book-api:4012
      # Braid engine jobs (braid-match-on-ingest / braid-rescan) embed via the
      # platform llm-provider (BBB_API_INTERNAL_URL) and recall/re-embed into
      # Qdrant. Both are degradable request-time deps (spec 9.2).
      BBB_API_INTERNAL_URL: http://api:4000
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      # braid-proposal-reconcile drives approved/rejected proposals through braid-api's
      # single merge executor (POST /internal/proposal-decided). Backstop for lost Bolt
      # proposal.decided delivery (Braid spec §4.6).
      BRAID_API_INTERNAL_URL: http://braid-api:4020
      # The 7 bulwark-* jobs are thin HTTP callers that invoke the engine over bulwark-api's
      # internal routes (Bulwark spec §4 / §9.2).
      BULWARK_API_INTERNAL_URL: http://bulwark-api:4021
      # The burn-* jobs (attribute-batch, extract-deliverables, and the sweeps) are thin HTTP
      # callers into burn-api's /v1/internal/engines routes, and the bill-recurring-generate
      # gate calls burn-api's precheck (Burn spec §8.1 / §9.3).
      BURN_API_INTERNAL_URL: http://burn-api:4022
    volumes:
      # Read-only view of what livekit-config rendered/advertised, for
      # the hourly livekit-ip-drift job: it re-detects the public IP via
      # STUN and writes a system_errors warning when LiveKit is
      # advertising a stale address (e.g. the ISP rotated the WAN IP
      # after the last render).
      - ./infra/livekit:/livekit-info:ro
    networks:
      - backend

  frontend:
    <<: *common
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: production
    depends_on:
      api:
        condition: service_healthy
      basis-api:
        condition: service_healthy
      braid-api:
        condition: service_healthy
      bulwark-api:
        condition: service_healthy
      burn-api:
        condition: service_healthy
      helpdesk-api:
        condition: service_healthy
      banter-api:
        condition: service_healthy
      beacon-api:
        condition: service_healthy
      brief-api:
        condition: service_healthy
      bolt-api:
        condition: service_healthy
      bearing-api:
        condition: service_healthy
      board-api:
        condition: service_healthy
      bond-api:
        condition: service_healthy
      blast-api:
        condition: service_healthy
      book-api:
        condition: service_healthy
      bench-api:
        condition: service_healthy
      blank-api:
        condition: service_healthy
      bin-api:
        condition: service_healthy
      bay-api:
        condition: service_healthy
      blip-api:
        condition: service_healthy
      blueprint-api:
        condition: service_healthy
      site:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # Read by infra/nginx/entrypoint.sh to render the TLS placeholders in
      # the bind-mounted nginx-with-site.conf. See docs/guides/local-ssl-notes.md.
      TLS_HTTP_MODE: ${TLS_HTTP_MODE:-none}
      EXT_HTTPS_PORT: ${EXT_HTTPS_PORT:-${HTTPS_PORT:-443}}
      TLS_CERT_SOURCE: ${TLS_CERT_SOURCE:-self-signed}
    volumes:
      # Bind-mount the nginx config as a TEMPLATE so the entrypoint can
      # sed-edit a working copy at /etc/nginx/conf.d/default.conf without
      # touching the read-only mount. Required for the TLS placeholder
      # substitution path.
      # Mount the templates outside /etc/nginx/templates/ — that directory
      # is auto-processed by the nginx:alpine `20-envsubst-on-templates.sh`
      # script, which would `envsubst` our `__HTTP_LISTEN__` placeholders into
      # /etc/nginx/conf.d/site.conf as-is (envsubst only handles `${var}`,
      # not `__FOO__`). nginx then refuses to start on the unsubstituted
      # directives. Mounting at a sibling path keeps our entrypoint as the
      # sole consumer of these templates.
      - ./infra/nginx/nginx-with-site.conf:/etc/nginx/bbb-templates/site.conf.template:ro
      - ./infra/nginx/tls-redirect.conf.template:/etc/nginx/bbb-templates/tls-redirect.conf.template:ro
      - ./docs/apps:/usr/share/nginx/html/docs/apps:ro
      # Default profile-picture options served at /avatars/ (mirrors the docs
      # bind-mount so newly-added avatars show without rebuilding the image).
      - ./assets/default-avatars:/usr/share/nginx/html/avatars:ro
      # TLS certs (gitignored). If empty, entrypoint silently runs HTTP-only.
      - ./certs:/etc/nginx/certs:ro
      # ACME HTTP-01 challenge webroot — shared with the certbot sidecar
      # behind the "letsencrypt" compose profile.
      - ./certs/acme-challenge:/var/www/certbot
    networks:
      - frontend

  site:
    <<: *common
    build:
      context: .
      dockerfile: infra/site/Dockerfile
    # The marketing site is not fronted by the app nginx (no /site route); it
    # serves itself. Publish its port so it is reachable locally for review
    # (override with SITE_PORT). In production it is served on its own domain.
    ports:
      - "${SITE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend

  helpdesk-api:
    <<: *common
    build:
      context: .
      dockerfile: apps/helpdesk-api/Dockerfile
      target: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/bigbluebam
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-bigbluebam-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      HELPDESK_URL: ${HELPDESK_URL:-http://localhost/helpdesk}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      # See note on api.COOKIE_SECURE: helpdesk-api also issues session and
      # csrf cookies, and the same Secure-over-HTTP drop applies.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${SMTP_FROM:-noreply@bigbluebam.io}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BBB_API_INTERNAL_URL: http://api:4000
      INTERNAL_HELPDESK_SECRET: ${INTERNAL_HELPDESK_SECRET:?INTERNAL_HELPDESK_SECRET is required}
      # BAM-RL-E2E: opt-in flag to multiply the global rate limit ceiling for
      # parallel e2e runs. Leave unset on real production deployments.
      BBB_E2E_PERMISSIVE_RATE_LIMIT: ${BBB_E2E_PERMISSIVE_RATE_LIMIT:-}
      RATE_LIMIT_E2E_MULTIPLIER: ${RATE_LIMIT_E2E_MULTIPLIER:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - frontend

  banter-api:
    <<: *common
    build:
      context: .
      dockerfile: apps/banter-api/Dockerfile
      target: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/bigbluebam
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-bigbluebam-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-ws://localhost:7880}
      BBB_API_INTERNAL_URL: http://api:4000
      VOICE_AGENT_URL: http://voice-agent:4003
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Wave D Phase 3: per-action permission enforcement at this satellite.
      # Calls the resolver via HTTP at $BBB_API_INTERNAL_URL.
      BBB_PERMISSIONS_ENFORCE: ${BBB_PERMISSIONS_ENFORCE:-warn}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend
      - frontend

  beacon-api:
    <<: *common
    build:
      context: .
      dockerfile: apps/beacon-api/Dockerfile
      target: production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      qdrant: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4004
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/bigbluebam
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-bigbluebam-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
      QDRANT_URL: http://qdrant:6333
      BBB_API_INTERNAL_URL: http://api:4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Wave D Phase 3: per-action permission enforcement at this satellite.
      # Calls the resolver via HTTP at $BBB_API_INTERNAL_URL.
      BBB_PERMISSIONS_ENFORCE: ${BBB_PERMISSIONS_ENFORCE:-warn}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4004/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - frontend

  brief-api:
    <<: *common
    build:
      context: .
      dockerfile: apps/brief-api/Dockerfile
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bigbluebam}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - BBB_API_INTERNAL_URL=http://api:4000
      - NODE_ENV=production
      - PORT=4005
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost}
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW_MS=60000
      # Wave D Phase 3: per-action permission enforcement at this satellite.
      # Calls the resolver via HTTP at $BBB_API_INTERNAL_URL.
      - BBB_PERMISSIONS_ENFORCE=${BBB_PERMISSIONS_ENFORCE:-warn}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4005/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
      - frontend

  bolt-api:
    <<: *common
    build:
      context: .
