      # the multi-provider slice ships. SESSION_SECRET is reused as a sane
      # fallback so a configured stack still gets a strong value.
      - BIN_SECRETS_KEY=${BIN_SECRETS_KEY:-${SESSION_SECRET}}
      - BIN_SECRETS_KEY_ID=${BIN_SECRETS_KEY_ID:-local-1}
      # Wave D Phase 3: per-action permission enforcement at this satellite.
      - BBB_PERMISSIONS_ENFORCE=${BBB_PERMISSIONS_ENFORCE:-warn}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4016/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - backend
      - frontend

  bay-api:
    <<: *common
    build:
      context: .
      dockerfile: apps/bay-api/Dockerfile
