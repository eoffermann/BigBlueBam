- id: beacon-search-results
  app: beacon
  demonstrates: "Search — hybrid query results with match-source badges and the QueryBuilder"
  route: /beacon/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
    - { action: click, selector: "aside button:has-text('Search')", optional: true }
    - { action: wait, ms: 1500 }
    - { action: fill, selector: "input[placeholder*='earch']", value: "deployment", optional: true }
    - { action: press, selector: "input[placeholder*='earch']", value: "Enter", optional: true }
    - { action: wait, ms: 2500 }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  masks:
    - "[data-testid='relative-timestamp']"
    - "time"
