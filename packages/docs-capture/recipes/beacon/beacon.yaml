# Beacon — knowledge base with freshness governance (route prefix /beacon/).
# Recipes mined from docs/apps/beacon/help.md (Feature reference + User Stories)
# and packages/docs-capture/src/apps/beacon.scenes.ts (known-working routes +
# setup selectors).
#
# Beacon is a single-page app: every view loads at /beacon/ and the left sidebar
# (`aside button:has-text("...")`) switches views client-side, so each recipe
# routes to /beacon/ and reaches its view via optional setup clicks lifted from
# the scenes file. No content blocks — the local stack is already seeded.
# Live timestamps (Recent Activity on Home, Last Verified on detail, Agent
# Activity on the dashboard) are masked. The Bureau presence widget is hidden
# globally by the engine.

- id: beacon-knowledge-home
  app: beacon
  demonstrates: "Knowledge Home — stat cards, quick-action cards, and Recent Activity"
  route: /beacon/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  masks:
    - "[data-testid='relative-timestamp']"
    - "time"

- id: beacon-knowledge-home-dark
  app: beacon
  demonstrates: "Knowledge Home in dark theme (marketing/retina)"
  route: /beacon/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
  capture: { target: fullPage, viewport: desktop-1440, theme: dark, deviceScaleFactor: 2 }
  masks:
    - "[data-testid='relative-timestamp']"
    - "time"

- id: beacon-browse-list
  app: beacon
  demonstrates: "Browse — the filterable article list with status chips and search"
  route: /beacon/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
    - { action: click, selector: "aside button:has-text('Browse')", optional: true }
    - { action: wait, ms: 2500 }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  masks:
    - "[data-testid='relative-timestamp']"
    - "time"

