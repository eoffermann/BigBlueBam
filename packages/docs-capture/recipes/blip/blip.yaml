# Blip — telemetry, log, and profiling intake (Blip §22).
# Captured against the seeded Gilligan dataset (Rescue Beacon iOS/Android).
# The iOS tracked-app id is deterministic from the seeder (uuid5).
# Volatile regions (seq, received_at, relative "Ns ago") are masked so diffs
# are stable; the live viewer is captured against the seeded backlog with tail
# paused (the §8.2 backfill state), never an open socket.

- id: blip-app-list
  app: blip
  demonstrates: "The tracked-app list: the two Rescue Beacon apps with collection status and recent-volume badges"
  route: /blip/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
    - { action: wait, ms: 800 }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  doc: { order: 1, label: "App list" }
  masks: ["time", "[datetime]"]

- id: blip-launchpad
  app: blip
  demonstrates: "The Launchpad open over Blip, showing all suite apps listed alphabetically with Blip among them"
  route: /blip/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
    - { action: click, selector: 'button[title="Launchpad — switch between apps"]' }
    - { action: wait, ms: 800 }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  doc: { order: 11, label: "Launchpad (alphabetical)" }

