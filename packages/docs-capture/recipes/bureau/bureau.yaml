# --- Room booking ----------------------------------------------------------
# /bureau/booking (parseRoute in App.tsx). Left column lists the org's bookable
# rooms grouped by floor; selecting one shows its schedule + a "Book this room"
# form. The Gilligan seed marks Radio Hut, Mary Ann's Kitchen, and The Lagoon
# bookable, and scripts/seed-gilligan/bureau-presence.mjs adds two upcoming
# bookings so the "Upcoming bookings" panel is populated, not the empty state.
# We click the first room card so the detail panel + booking form are in frame.
- id: bureau-room-booking
  app: bureau
  demonstrates: "Room booking — pick a bookable room, see its upcoming reservations, and book a slot with a locked/open access toggle"
  route: /bureau/booking
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
    # The booking route is lazy-loaded; wait for the heading itself (not just
    # the layout <main>) before selecting a room, or the assertion can fire
    # before the chunk mounts.
    - { action: waitFor, selector: "h1:has-text('Book a room')" }
    # Select the room that has a seeded reservation so the schedule + the
    # Book-this-room form render (The Lagoon carries "All-hands raft launch").
    # Match on the capacity subtext ("up to 12"), which is unique to the room
    # card: the sidebar floor-nav entries also carry door-open icons and a
    # similar name ("The Lagoon HQ"), so a name/icon match would hit the nav
    # button and navigate away from /booking. Waiting on this selector also
    # gates until the async room list has populated.
    - { action: waitFor, selector: "button:has-text('up to 12')" }
    - { action: click, selector: "button:has-text('up to 12')", optional: true }
    - { action: wait, ms: 1200 }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  expect:
    # Target the page heading specifically. A bare text= match also hits the
    # top-bar route title, whose element is the first DOM match but gets hidden
    # by the volatile-overlay pass before verification, so .first() would read
    # as not-visible even though the heading is on screen.
    - "h1:has-text('Book a room')"
  expectNot:
    - "text=No bookable rooms"
  doc: { order: 6, label: "Room booking" }

# --- Admin · Settings ------------------------------------------------------
# /bureau/admin/settings. Org-wide toggles (continuous audio, auto-follow,
# members-can-book, members-can-create-rooms) + the default-office-privacy
# select. The settings row auto-creates on first read; the Gilligan seed PATCHes
# it to a deliberate non-default state so the toggles read as a real config.
- id: bureau-admin-settings
  app: bureau
  demonstrates: "Admin · Settings — org-wide Bureau defaults for spatial audio, auto-follow, member booking/room-creation, and default office privacy"
  route: /bureau/admin/settings
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
    - { action: waitFor, selector: "button[role=switch]", optional: true }
    - { action: wait, ms: 800 }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  expect:
    - "text=Bureau settings"
  doc: { order: 7, label: "Admin settings" }

# --- Live floor with seeded presence --------------------------------------
# The same live floor view as bureau-live-floor (order 2), but specifically to
# showcase the seeded presence: scripts/seed-gilligan/bureau-presence.mjs places
# four castaways in rooms with statuses (Skipper available, Professor dnd,
# Mary Ann available, Ginger busy), so the canvas paints occupant dots and the
# floor/office cards show who is in. Occupant dots are painted on the <canvas>
# (not maskable); the Live connection chip is masked as before.
- id: bureau-presence-on-floor
  app: bureau
  demonstrates: "Live presence on the floor — castaways shown in their rooms with status, the spatial map painting occupant dots in real time"
  route: /bureau/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
    - { action: click, selector: "button.group", optional: true }
    - { action: waitFor, selector: "canvas.floor-canvas", optional: true }
    - { action: wait, ms: 3500 }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  doc: { order: 8, label: "Live presence" }
  masks:
    # Connection status chip ("Live" / connecting / reconnecting) varies with the WS link.
    - "span.text-emerald-600"
    - "span.text-amber-600"
