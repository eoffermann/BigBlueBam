  expect: ["text=Readiness", "text=Not set up yet"]
  expectNot: "text=Please log in"
  capture: { target: fullPage, viewport: desktop-1440, theme: dark, deviceScaleFactor: 2 }
  doc: { order: 1, label: "Readiness" }

