# Bastion - continuous compliance readiness for SOC 2 and ISO 27001.
#
# Recipes drive the docs-capture engine. Every route is confirmed against
# apps/bastion/src/app.tsx parseRoute: /bastion/ (Readiness), /bastion/setup,
# /bastion/controls, /bastion/controls/:id (Control detail), /bastion/coverage
# (Evidence map), /bastion/gaps (What to fix first), /bastion/evidence (Evidence
# locker), /bastion/review (Review queue), /bastion/policies, /bastion/attest
# (Policies to read), /bastion/questionnaires, /bastion/questionnaires/:id,
# /bastion/sharing, /bastion/settings and /bastion/room (the public auditor room,
# token in the URL fragment). None invented.
#
# Identity is `admin`, which the docs-capture environment resolves to the gilligan
# cast (skipper@gilligantravel.example) - GILLIGAN data only, never the generic
# e2e org. The stack is seeded by scripts/seed-gilligan/bastion.mjs before capture
# (expectations in scripts/seed-gilligan/bastion.expectations.mjs), so there are
# no `content` blocks: each view captures the seeded SOC 2 + ISO 27001 setup with
# 4 checks left unconfirmed, the 2-Step Verification report and Mary Ann's
# background-check statement, the Radio Relay key exception, the laptop-encryption
# top gap, the Island Information Security Policy (5 of 7 read), the Howell
# Industries Vendor Security Review, and the Lagoon & Reef CPAs auditor room.
#
# Recipe ids are global, so each carries the `bastion-` prefix, which the bridge
# strips. The ids and `doc.order` values produce exactly the numbered files that
# docs/apps/bastion/help.md and guide.md already reference (01-readiness.png ...
# 14-auditor-room.png) through scripts/docs/bridge.mjs. Detail routes (:id) need a
# runtime id, so they are reached by clicking a seeded row. The `-dark` siblings
# share their light sibling's `doc.order` so the bridge pairs them into
# screenshots/light and screenshots/dark; the marketing section
# (site/src/components/sections/bastion-section.tsx) uses readiness,
# what-to-fix-first and control-detail in light and readiness in dark.
#
# The auditor room (14) needs a live room token, which is shown once when a room
# is created and is never stored. Before capturing, create a room on
# /bastion/sharing as Skipper (no passcode, ISO 27001), copy the link, and export
# the part after "#" as BASTION_ROOM_TOKEN. Without it the navigate step is
# skipped and the recipe FAILS on its expect, so it never writes a misleading
# image. Revoke the room afterwards.

- id: bastion-readiness
  app: bastion
  demonstrates: "Readiness: the four numbers kept apart (Proven by the suite, Proven by evidence you provided, Not met with its risk-accepted count, Can't prove yet) with Not set up yet beside them, the denominator sentence, the top gaps and evidence expiring soon."
  route: /bastion/
  identity: admin
  interactions:
    - { action: waitFor, selector: main, optional: true }
    - { action: waitFor, selector: "text=Not set up yet", optional: true }
  expect: ["text=Readiness", "text=Not set up yet"]
  expectNot: "text=Please log in"
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  doc: { order: 1, label: "Readiness" }

- id: bastion-readiness-dark
  app: bastion
  demonstrates: "Readiness in dark theme (marketing/retina)."
