- id: bastion-auditor-room
  app: bastion
  demonstrates: "The auditor room as the auditor sees it, outside the suite: the period, the controls with their state and the evidence behind them (story: review a room as the auditor)."
  route: /bastion/
  identity: admin
  interactions:
    # A full navigation from another page: the room reads its token from the fragment once, on load.
    - { action: navigate, url: "/bastion/room#${BASTION_ROOM_TOKEN}", skipIfEnvUnset: BASTION_ROOM_TOKEN }
    - { action: waitFor, selector: "text=Auditor room" }
    - { action: wait, ms: 1500 }
  expect: "text=Auditor room"
  expectNot: ["text=Please log in", "h1:has-text('Readiness')"]
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  doc: { order: 14, label: "Auditor room" }
