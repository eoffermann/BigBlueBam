# Bam — sprint-based Kanban project & task management (route prefix /b3/).
# Recipes mined from docs/apps/bam/help.md (Feature reference + User Stories) and
# packages/docs-capture/src/apps/bam.scenes.ts (known-working routes + setup).
#
# Routing note: Bam's per-project views (board, dashboard, reports, audit log)
# live under /projects/:id/... and need a project UUID we can't hardcode. Every
# project-scoped recipe therefore lands on the dashboard (/b3/) and clicks the
# first project card (`button.group`, which navigates to /projects/:id/board),
# then drives the board header controls from there. All such setup clicks are
# marked `optional: true` so a quirk in the seeded stack can't fail the run.
#
# Selector basis (verified against the frontend source):
#   - project cards on the dashboard: `button.group` (h3 = project name)
#   - task cards on the board: `[data-task-id]` (opens the detail drawer)
#   - view switcher: `button[aria-label="List view"]` etc. (Board/List/Timeline/
#     Calendar/Workload)
#   - board header action icons carry stable `title=` attrs: "Manage epics",
#     "Import tasks", "Task templates", "Saved views", "Project options"
#   - sprint create toggle: `button[aria-label="Create sprint"]`
#   - settings tabs are plain buttons: `button:has-text("Tasks")` etc.
# The Bureau presence widget is hidden globally by the engine; masks below only
# cover live relative timestamps / presence where they intrude.

# ---------------------------------------------------------------------------
# Dashboard / project list — the Bam home page.
# ---------------------------------------------------------------------------
- id: bam-dashboard
  app: bam
  demonstrates: "The Bam dashboard listing every project the user can see"
  route: /b3/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
    - { action: wait, ms: 1000 }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }

# ---------------------------------------------------------------------------
# Kanban board — the primary view. Drill in from the dashboard card grid.
# ---------------------------------------------------------------------------
- id: bam-board
  app: bam
  demonstrates: "A project's Kanban board with phase columns and task cards"
  route: /b3/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
    - { action: waitFor, selector: "button.group" }
    - { action: click, selector: "button.group", optional: true }
    - { action: waitFor, selector: "[data-task-id]" }
    - { action: wait, ms: 2000 }
  expect: ["[data-task-id]"]
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  doc: { order: 1, label: "Kanban board" }
  masks:
    - "[data-testid='presence-avatars']"

# One dark + retina variant for the primary board view (marketing/retina).
- id: bam-board-dark
  app: bam
  demonstrates: "The Kanban board in dark theme (marketing/retina)"
  route: /b3/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
    - { action: waitFor, selector: "button.group" }
    - { action: click, selector: "button.group", optional: true }
    - { action: waitFor, selector: "[data-task-id]" }
    - { action: wait, ms: 2000 }
  expect: ["[data-task-id]"]
  capture: { target: fullPage, viewport: desktop-1440, theme: dark, deviceScaleFactor: 2 }
  doc: { order: 1, label: "Kanban board" }
  masks:
    - "[data-testid='presence-avatars']"

