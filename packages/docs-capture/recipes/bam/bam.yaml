# ---------------------------------------------------------------------------
# Sprint create form — opened from the board's sprint selector.
# ---------------------------------------------------------------------------
- id: bam-sprint-create
  app: bam
  demonstrates: "The board sprint selector with the create-sprint form expanded"
  route: /b3/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
    - { action: waitFor, selector: "button.group" }
    - { action: click, selector: "button.group", optional: true }
    - { action: waitFor, selector: "[data-task-id]" }
    - { action: click, selector: "button[aria-label='Create sprint']", optional: true }
    # Fill the sprint name so the Create button is enabled (not dimmed/disabled).
    - { action: fill, selector: "input[placeholder='Sprint 1']", value: "Voyage Sprint — Escape the Island", optional: true }
    - { action: wait, ms: 1000 }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  doc: { order: 3, label: "Sprint planning" }

