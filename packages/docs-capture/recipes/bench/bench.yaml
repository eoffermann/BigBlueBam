# Bench — analytics dashboards and ad-hoc queries across the suite.
# Recipes mined from docs/apps/bench/help.md (Feature reference + User Stories)
# and the known-working routes/selectors in src/apps/bench.scenes.ts.
# Content is omitted everywhere: the local stack is already seeded with the
# Engineering Overview and other dashboards, so these capture existing data.
# Live timestamps ("last updated"/"last sent") and chart tooltips are masked.
# The dashboard-view click setup is optional so a missing card never fails a run.

- id: bench-dashboard-list
  app: bench
  demonstrates: "The Dashboards landing grid: dashboard cards with visibility pills, widget counts, and last-updated times"
  route: /bench/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  masks:
    - "time"
    - "[datetime]"

- id: bench-dashboard-view
  app: bench
  demonstrates: "A single dashboard opened in the read view, with its widget grid (charts, KPI cards, query timings) and toolbar"
  route: /bench/
  identity: admin
  interactions:
    - { action: waitFor, selector: '[class*="rounded-xl"][class*="cursor-pointer"]' }
    - { action: click, selector: '[class*="rounded-xl"][class*="cursor-pointer"]', optional: true }
    - { action: wait, ms: 2500 }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  masks:
    - "time"
    - "[datetime]"
    - ".recharts-tooltip-wrapper"

- id: bench-dashboard-view-dark
  app: bench
  demonstrates: "The dashboard read view in dark theme (marketing/retina)"
  route: /bench/
  identity: admin
  interactions:
    - { action: waitFor, selector: '[class*="rounded-xl"][class*="cursor-pointer"]' }
    - { action: click, selector: '[class*="rounded-xl"][class*="cursor-pointer"]', optional: true }
    - { action: wait, ms: 2500 }
  capture: { target: fullPage, viewport: desktop-1440, theme: dark, deviceScaleFactor: 2 }
  masks:
    - "time"
    - "[datetime]"
    - ".recharts-tooltip-wrapper"

