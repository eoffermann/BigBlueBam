# Book — scheduling and calendar for your team.
# Recipes mined from docs/apps/book/help.md (Feature reference + User Stories)
# and verified against apps/book/src/App.tsx parseRoute.
#
# Routes (parseRoute, BASE_PATH=/book):
#   /                        -> week (default landing)
#   /month                   -> month
#   /day                     -> day
#   /timeline                -> timeline
#   /booking-pages           -> booking-pages list
#   /settings/working-hours  -> working-hours
#   /settings/calendars      -> calendars
#   /settings/connections    -> connections
# All scene routes matched parseRoute as written; no corrections needed.
#
# Content is seeded by the local stack, so every recipe omits `content`.
# The frozen clock (SHOTS_FROZEN_TIME) makes "Today"/current-week deterministic,
# but the live current-time indicator and the highlighted "today" column/cell
# still derive from wall-vs-frozen rendering, so they are masked on the time-grid
# views (week/day) where a stray now-line would vary the pixels.
# The Bureau presence widget is hidden globally by the capture engine.

- id: book-week-view
  app: book
  demonstrates: "The default Book landing — a 7-day week grid with event blocks placed by time"
  route: /book/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
  capture: { target: fullPage, viewport: desktop-1440, theme: light }
  doc: { order: 1, label: "Week view" }
  masks:
    - "[data-testid='current-time-indicator']"
    - ".now-line"

- id: book-week-view-dark
  app: book
  demonstrates: "The week grid in dark theme at retina scale (marketing/retina)"
  route: /book/
  identity: admin
  interactions:
    - { action: waitFor, selector: main }
  capture: { target: fullPage, viewport: desktop-1440, theme: dark, deviceScaleFactor: 2 }
  doc: { order: 1, label: "Week view" }
  masks:
    - "[data-testid='current-time-indicator']"
    - ".now-line"

